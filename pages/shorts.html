        /* Top Header Overlay */
        .shorts-top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 100;
            background: linear-gradient(180deg, rgba(0,0,0,0.7) 0%, transparent 100%);

        .shorts-brand-title {
            font-size: 19px;

            display: flex;
            align-items: center;
            gap: 16px;
        }

        .shorts-top-icons svg {
            width: 22px;
            height: 22px;
            fill: #ffffff;
            cursor: pointer;
        }

        /* Vertical Snap Scroll Feed */
        .shorts-feed-container {
            width: 100%;
            height: calc(100vh - var(--bottom-bar-height));
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scrollbar-width: none;
            position: relative;
        }

        .shorts-feed-container::-webkit-scrollbar {
            display: none;
        }

        /* Single Short Card (Full Viewport) */
        .short-card-item {
            width: 100%;
            height: 100%;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            position: relative;
            background: #0a0a0a;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .short-video-player {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Right Floating Action Rail */
        .shorts-action-rail {
            position: absolute;
            right: 12px;
            bottom: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            z-index: 50;
        }

        .rail-action-btn {
            background: none;
            border: none;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        .rail-icon-circle {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s;
        }

        .rail-action-btn:active .rail-icon-circle {
            transform: scale(0.85);
        }

        .rail-icon-circle svg {
            width: 22px;
            height: 22px;
            fill: #ffffff;
        }

        .rail-btn-text {
            font-size: 11px;
            font-weight: 600;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }

        .vinyl-disc-spin {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #111;
            border: 4px solid #222;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: discSpin 4s linear infinite;
        }

        @keyframes discSpin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Bottom Creator Meta Overlay */
        .shorts-meta-overlay {
            position: absolute;
            bottom: 18px;
            left: 14px;
            right: 76px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 50;
        }

        .creator-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .creator-thumb {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: linear-gradient(135deg, #e50914, #ff5252);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 800;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        .creator-name {
            font-size: 14px;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
            text-decoration: none;
        }

        .btn-shorts-subscribe {
            background: #ffffff;
            color: #0f0f0f;
            border: none;
            padding: 5px 12px;
            border-radius: 16px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-shorts-subscribe.subscribed {
            background: rgba(255, 255, 255, 0.2);
            color: #ffffff;
        }

        .short-caption-text {
            font-size: 13px;
            line-height: 1.35;
            color: #ffffff;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .short-sound-track {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.85);
        }

            width: 13px;
            height: 13px;
            fill: #ffffff;

Is screen par YouTube Shorts jaisa immersive view milega:
1. **Vertical 9:16 Feed**: Poori screen par vertical swipe experience.
2. **Right-side Action Rail**: Like counter, comments button, share, aur remix audio option.
3. **Bottom Overlay**: Creator channel handle, video caption, hashtags, aur subscription toggle.
4. **Touch & Tap Controls**: Screen tap karne par video pause/play toggle.

---

### Step-by-Step GitHub Guide:

1. GitHub par `BharatTube` repo kholein.
2. `pages/` folder mein jayein.
3. **Add file** -> **Create new file** par tap karein.
4. File name likhein: `pages/shorts.html`
5. Neeche diya gaya code paste karein aur **Commit changes...** dabakar save kar lein.

    <script>
        // Tap to pause/play
        function togglePlay(video) {
            if (video.paused) {
                video.play();
            } else {
                video.pause();
            }
        }

        // Like Toggle
        function toggleLike(btn) {
            const icon = btn.querySelector('svg');
            const isLiked = icon.style.fill === 'rgb(255, 0, 0)';
            icon.style.fill = isLiked ? '#ffffff' : '#ff0000';
        }

        // Subscribe Toggle
        function toggleSub(btn) {
            const active = btn.classList.toggle('active');
            btn.textContent = active ? 'Subscribed' : 'Subscribe';
        }

        // Share
        function shareCurrentShort() {
            if (navigator.share) {
                navigator.share({
                    title: 'BharatTube Shorts',
                    url: window.location.href
                }).catch(() => {});
            } else {
                navigator.clipboard.writeText(window.location.href);
                alert('Short link copied to clipboard!');
            }
        }

        // Auto play on scroll
        const container = document.getElementById('shortsContainer');
        const videos = container.querySelectorAll('video');

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                const video = entry.target.querySelector('video');
                if (entry.isIntersecting) {
                    video.play().catch(() => {});
                } else {
                    video.pause();
                }
            });
        }, { threshold: 0.6 });

        document.querySelectorAll('.short-slide').forEach(slide => observer.observe(slide));
    </script>
