<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>Shorts - BharatTube</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000000;
        }

        /* Top Bar */
        .shorts-top-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 100;
            background: linear-gradient(180deg, rgba(0,0,0,0.7) 0%, transparent 100%);
        }

        .shorts-brand-title {
            font-size: 19px;
            font-weight: 800;
            color: #ffffff;
        }

        /* Fullscreen Viewport */
        .shorts-feed-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: calc(100vh - 56px);
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scrollbar-width: none;
            z-index: 10;
        }

        .shorts-feed-container::-webkit-scrollbar {
            display: none;
        }

        .short-card-item {
            position: relative;
            width: 100vw;
            height: calc(100vh - 56px);
            scroll-snap-align: start;
            scroll-snap-stop: always;
            background: #000000;
            overflow: hidden;
        }

        /* Video Stretch */
        .short-video-player {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        /* Gradient Shade on Video */
        .video-shade {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(0,0,0,0.3) 0%, transparent 30%, transparent 70%, rgba(0,0,0,0.8) 100%);
            z-index: 2;
            pointer-events: none;
        }

        /* Right Floating Action Rail */
        .shorts-action-rail {
            position: absolute;
            right: 12px;
            bottom: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            z-index: 30;
        }

        .rail-action-btn {
            background: none;
            border: none;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        .rail-icon-circle {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .rail-icon-circle svg {
            width: 22px;
            height: 22px;
            fill: #ffffff;
        }

        .rail-btn-text {
            font-size: 11px;
            font-weight: 600;
            text-shadow: 0 1px 3px rgba(0,0,0,0.9);
        }

        /* Bottom Creator Meta */
        .shorts-meta-overlay {
            position: absolute;
            bottom: 20px;
            left: 14px;
            right: 76px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 30;
        }

        .creator-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .creator-thumb {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #e50914;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 800;
            color: #ffffff;
            border: 1.5px solid #ffffff;
        }

        .creator-name {
            font-size: 14px;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 1px 3px rgba(0,0,0,0.9);
            text-decoration: none;
        }

        .btn-shorts-subscribe {
            background: #ffffff;
            color: #0f0f0f;
            border: none;
            padding: 5px 12px;
            border-radius: 16px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .short-caption-text {
            font-size: 13px;
            line-height: 1.4;
            color: #ffffff;
            text-shadow: 0 1px 3px rgba(0,0,0,0.9);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .short-sound-track {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.9);
            text-shadow: 0 1px 3px rgba(0,0,0,0.9);
        }

        .short-sound-track svg {
            width: 13px;
            height: 13px;
            fill: #ffffff;
        }

        /* Fixed Bottom Nav */
        .bottom-nav-fixed {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 56px;
            background: #0f0f0f;
            display: flex;
            align-items: center;
            justify-content: space-around;
            border-top: 1px solid #272727;
            z-index: 1000;
        }

        .nav-link-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 10px;
            color: #aaaaaa;
            text-decoration: none;
            gap: 3px;
        }

        .nav-link-btn.active {
            color: #ffffff;
        }

        .nav-link-btn svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        .nav-btn-plus {
            background: #272727;
            border-radius: 50%;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            text-decoration: none;
        }

        .nav-btn-plus svg {
            width: 22px;
            height: 22px;
            fill: #ffffff;
        }
    </style>
</head>
<body>

    <!-- Top Overlay -->
    <header class="shorts-top-bar">
        <div class="shorts-brand-title">Shorts</div>
        <a href="upload.html" style="color:#ffffff; text-decoration:none;">
            <svg viewBox="0 0 24 24" style="width:24px; height:24px; fill:#fff;"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        </a>
    </header>

    <!-- Shorts Deck -->
    <div class="shorts-feed-container" id="shortsContainer">

        <!-- Slide 1 -->
        <section class="short-card-item">
            <video class="short-video-player" playsinline loop muted autoplay onclick="togglePlay(this)">
                <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4" type="video/mp4">
            </video>
            <div class="video-shade"></div>

            <div class="shorts-meta-overlay">
                <div class="creator-row">
                    <div class="creator-thumb">CB</div>
                    <a href="channel.html" class="creator-name">@charandas_creator</a>
                    <button class="btn-shorts-subscribe" onclick="toggleSub(this)">Subscribe</button>
                </div>
                <div class="short-caption-text">
                    BharatTube special culture & rural lifestyle shorts #Chhattisgarh #Folk #Shorts
                </div>
                <div class="short-sound-track">
                    <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
                    <span>Original Audio • Charandas Bhaskar</span>
                </div>
            </div>

            <div class="shorts-action-rail">
                <button class="rail-action-btn" onclick="toggleLike(this)">
                    <div class="rail-icon-circle">
                        <svg viewBox="0 0 24 24"><path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"/></svg>
                    </div>
                    <span class="rail-btn-text">128K</span>
                </button>

                <button class="rail-action-btn" onclick="alert('Comments: Super reel!')">
                    <div class="rail-icon-circle">
                        <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/></svg>
                    </div>
                    <span class="rail-btn-text">2,410</span>
                </button>

                <button class="rail-action-btn" onclick="shareShort()">
                    <div class="rail-icon-circle">
                        <svg viewBox="0 0 24 24"><path d="M14 9V5l7 7-7 7v-4.1c-5 0-8.5 1.6-11 5.1 1-5 4-10 11-11z"/></svg>
                    </div>
                    <span class="rail-btn-text">Share</span>
                </button>

                <button class="rail-action-btn" onclick="alert('Remix Sound feature enabled!')">
                    <div class="rail-icon-circle">
                        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14.5v-9l6 4.5-6 4.5z"/></svg>
                    </div>
                    <span class="rail-btn-text">Remix</span>
                </button>
            </div>
        </section>

    </div>

    <!-- Bottom Nav -->
    <nav class="bottom-nav-fixed">
        <a href="../index.html" class="nav-link-btn">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span>Home</span>
        </a>
        <a href="shorts.html" class="nav-link-btn active">
            <svg viewBox="0 0 24 24"><path d="M17.77 10.32l-1.2-.5-1.1-.46 1.05-.53c1.78-.9 2.5-3.08 1.6-4.86-.9-1.78-3.08-2.5-4.86-1.6L6.5 5.67c-1.78.9-2.5 3.08-1.6 4.86.32.64.83 1.13 1.44 1.43l1.2.5 1.1.46-1.05.53c-1.78.9-2.5 3.08-1.6 4.86.63 1.25 1.88 1.99 3.23 1.99.55 0 1.11-.13 1.63-.39l6.76-3.3c1.78-.9 2.5-3.08 1.6-4.86-.32-.64-.83-1.13-1.44-1.43zM10 14.5v-5l4.5 2.5-4.5 2.5z"/></svg>
            <span>Shorts</span>
        </a>
        <a href="upload.html" class="nav-btn-plus">
            <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        </a>
        <a href="channel.html" class="nav-link-btn">
            <svg viewBox="0 0 24 24"><path d="M20 8H4V6h16v2zm-2-6H6v2h12V2zm4 10v8c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2v-8c0-1.1.9-2 2-2h16c1.1 0 2 .9 2 2zm-6 4l-6-3.27v6.53L16 16z"/></svg>
            <span>Subscriptions</span>
        </a>
        <a href="profile.html" class="nav-link-btn">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>
            <span>You</span>
        </a>
    </nav>

    <script>
        function togglePlay(video) {
            if (video.paused) {
                video.play();
            } else {
                video.pause();
            }
        }

        function toggleLike(btn) {
            const icon = btn.querySelector('svg');
            const isLiked = icon.style.fill === 'rgb(255, 0, 0)';
            icon.style.fill = isLiked ? '#ffffff' : '#ff0000';
        }

        function toggleSub(btn) {
            const active = btn.classList.toggle('active');
            btn.textContent = active ? 'Subscribed' : 'Subscribe';
            btn.style.background = active ? 'rgba(255,255,255,0.2)' : '#ffffff';
            btn.style.color = active ? '#ffffff' : '#0f0f0f';
        }

        function shareShort() {
            if (navigator.share) {
                navigator.share({ title: 'BharatTube Shorts', url: window.location.href }).catch(() => {});
            } else {
                navigator.clipboard.writeText(window.location.href);
                alert('Short link copied!');
            }
        }
    </script>
</body>
</html>
