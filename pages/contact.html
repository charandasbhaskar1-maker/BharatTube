<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0f0f0f">
    <title>Contact & Sahayata - BharatTube</title>
    <link rel="stylesheet" href="../assets/css/global.css">
    <style>
        .policy-container {
            padding: 16px;
            max-width: 680px;
            margin: 0 auto;
            padding-bottom: 90px;
        }
        .policy-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--yt-border);
        }
        .back-btn {
            background: none;
            border: none;
            color: #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
        }
        .back-btn svg { width: 24px; height: 24px; fill: #ffffff; }
        .rule-card {
            background: var(--yt-surface);
            border: 1px solid var(--yt-border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .rule-card h3 {
            font-size: 16px;
            margin-bottom: 8px;
            color: var(--yt-blue);
        }
        .rule-card p {
            font-size: 13px;
            color: #cccccc;
            line-height: 1.6;
        }
        .input-group {
            margin-bottom: 12px;
        }
        .input-group label {
            display: block;
            font-size: 12px;
            color: var(--yt-muted);
            margin-bottom: 6px;
        }
        .input-group input, .input-group textarea {
            width: 100%;
            background: #111111;
            border: 1px solid var(--yt-border);
            border-radius: 8px;
            padding: 10px 12px;
            color: #ffffff;
            font-size: 13px;
            outline: none;
        }
        .contact-btn {
            width: 100%;
            background: var(--yt-blue);
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 20px;
            font-weight: 700;
            cursor: pointer;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="policy-container">
        <div class="policy-header">
            <button class="back-btn" onclick="window.history.back()">
                <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            </button>
            <h1 style="font-size: 18px; font-weight:700;">Sampark aur Sahayata (Support)</h1>
        </div>

        <div class="rule-card">
            <h3>📬 BharatTube Sahayata Kendra</h3>
            <p>Agar aapko channel monetization, copyright notice, technical samasya ya kisi feedback ke liye sahayata chahiye, toh aap seedhe hamari team se sampark kar sakte hain.</p>
        </div>

        <div class="rule-card">
            <div class="input-group">
                <label>Aapka Naam</label>
                <input type="text" placeholder="Apna naam darj karein" value="Charandas Bhaskar">
            </div>
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" placeholder="Apna email darj karein" value="bhaskar@gmail.com">
            </div>
            <div class="input-group">
                <label>Vishay (Subject)</label>
                <input type="text" placeholder="Samasya ka mukhya bindu">
            </div>
            <div class="input-group">
                <label>Sandesh (Message)</label>
                <textarea rows="4" placeholder="Apni samasya ya sawal vistar se likhein..."></textarea>
            </div>
            <button class="contact-btn" onclick="alert('Dhanyawad! Aapka sandesh BharatTube Support Team ko bhej diya gaya hai. 24 ghante mein jawab milega.'); window.history.back();">
                Sandesh Bhejein 🚀
            </button>
        </div>
    </div>

    <script src="../assets/js/app-state.js"></script>
    <script src="../assets/js/ui-kit.js"></script>
</body>
</html>
