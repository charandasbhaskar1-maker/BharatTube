<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#070b10">
    <title>BharatTube - Login & Register</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg: #070b10;
            --panel: #111821;
            --panel2: #171f29;
            --border: #27313d;
            --text: #f5f7fa;
            --muted: #9aa5b1;
            --red: #ff3040;
            --red-hover: #d91f2d;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px 16px;
        }

        .auth-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 420px;
            margin: 0 auto;
            width: 100%;
        }

        .back-link {
            color: var(--muted);
            text-decoration: none;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .brand-mini {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: var(--text);
        }

        .brand-logo {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: var(--red);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 18px;
        }

        .brand-name {
            font-size: 18px;
            font-weight: 800;
        }

        .auth-container {
            max-width: 420px;
            width: 100%;
            margin: 30px auto;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 28px 20px;
        }

        .auth-tabs {
            display: flex;
            background: var(--panel2);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 24px;
        }

        .tab-btn {
            flex: 1;
            background: transparent;
            border: 0;
            color: var(--muted);
            padding: 10px;
            font-size: 14px;
            font-weight: 700;
            border-radius: 9px;
            cursor: pointer;
            transition: 0.2s;
        }

        .tab-btn.active {
            background: var(--red);
            color: #ffffff;
        }

        .form-title {
            font-size: 20px;
            margin-bottom: 6px;
        }

        .form-subtitle {
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #c9d2dc;
        }

        .input-group input {
            width: 100%;
            height: 44px;
            background: var(--panel2);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0 14px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
        }

        .input-group input:focus {
            border-color: var(--red);
        }

        .submit-btn {
            width: 100%;
            height: 44px;
            background: var(--red);
            border: 0;
            border-radius: 10px;
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.2s;
        }

        .submit-btn:hover {
            background: var(--red-hover);
        }

        .auth-footer-text {
            text-align: center;
            font-size: 11px;
            color: var(--muted);
            margin-top: 18px;
            line-height: 1.4;
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 30px;
            transform: translate(-50%, 20px);
            background: #ffffff;
            color: #0b0f14;
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            opacity: 0;
            pointer-events: none;
            transition: 0.25s ease;
            z-index: 3000;
            white-space: nowrap;
        }

        .toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        footer {
            text-align: center;
            font-size: 12px;
            color: var(--muted);
            padding: 10px 0;
        }
    </style>
</head>
<body>

    <header class="auth-header">
        <a href="../frontend/index.html" class="back-link">← Home</a>
        <div class="brand-mini">
            <div class="brand-logo">B</div>
            <span class="brand-name">BharatTube</span>
        </div>
    </header>

    <main class="auth-container">
        <div class="auth-tabs">
            <button class="tab-btn active" id="loginTab">Login</button>
            <button class="tab-btn" id="registerTab">Register</button>
        </div>

        <!-- LOGIN FORM -->
        <form id="loginForm">
            <h2 class="form-title">Welcome Back</h2>
            <p class="form-subtitle">अपने BharatTube अकाउंट में लॉगिन करें</p>

            <div class="input-group">
                <label>Mobile Number या Email</label>
                <input type="text" id="loginId" placeholder="उदा. 9876543210 या name@mail.com" required>
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" id="loginPassword" placeholder="••••••••" required>
            </div>

            <button type="submit" class="submit-btn">Login करें</button>
        </form>

        <!-- REGISTER FORM -->
        <form id="registerForm" style="display: none;">
            <h2 class="form-title">Create Account</h2>
            <p class="form-subtitle">BharatTube पर नया क्रिएटर/यूज़र अकाउंट बनाएं</p>

            <div class="input-group">
                <label>आपका नाम (Full Name)</label>
                <input type="text" id="regName" placeholder="उदा. Charandas Bhaskar" required>
            </div>

            <div class="input-group">
                <label>Mobile Number या Email</label>
                <input type="text" id="regContact" placeholder="उदा. 9876543210" required>
            </div>

            <div class="input-group">
                <label>Password सेट करें</label>
                <input type="password" id="regPassword" placeholder="कम से कम 6 अक्षर" required>
            </div>

            <button type="submit" class="submit-btn">Register करें</button>
        </form>

        <p class="auth-footer-text">
            जारी रखकर आप BharatTube की सेवा की शर्तों से सहमत होते हैं।
        </p>
    </main>

    <footer>
        BharatTube © 2026 • Made for India
    </footer>

    <div id="toast" class="toast"></div>

    <script>
        const loginTab = document.getElementById('loginTab');
        const registerTab = document.getElementById('registerTab');
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const toast = document.getElementById('toast');

        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        loginTab.addEventListener('click', () => {
            loginTab.classList.add('active');
            registerTab.classList.remove('active');
            loginForm.style.display = 'block';
            registerForm.style.display = 'none';
        });

        registerTab.addEventListener('click', () => {
            registerTab.classList.add('active');
            loginTab.classList.remove('active');
            registerForm.style.display = 'block';
            loginForm.style.display = 'none';
        });

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            showToast('लॉगिन सफल! (Frontend Demo)');
            setTimeout(() => {
                window.location.href = '../frontend/index.html';
            }, 1200);
        });

        registerForm.addEventListener('submit', (e) => {
            e.preventDefault();
            showToast('अकाउंट बन गया! लॉगिन कर रहे हैं...');
            setTimeout(() => {
                window.location.href = '../frontend/index.html';
            }, 1200);
        });
    </script>
</body>
</html>
