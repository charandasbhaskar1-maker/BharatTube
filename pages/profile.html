<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0f0f0f">
    <title>Profile - BharatTube</title>
    <link rel="stylesheet" href="../assets/css/global.css">
    <style>
        body { padding-bottom: 80px; }

        .profile-hero {
            padding: 16px 16px 14px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .profile-meta-row {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .creator-avatar-wrap {
            width: 68px;
            height: 68px;
            border-radius: 50%;
            background: linear-gradient(135deg, #e50914, #ff5252);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: 800;
            color: #ffffff;
            flex-shrink: 0;
            border: 2px solid rgba(255, 255, 255, 0.15);
        }

        .creator-title-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .creator-title-row h1 {
            font-size: 19px;
            font-weight: 700;
        }

        .verified-badge-svg {
            display: none;
            width: 17px;
            height: 17px;
            fill: var(--yt-blue);
        }

        .creator-handle {
            font-size: 13px;
            color: var(--yt-muted);
            margin: 3px 0 6px;
        }

        .profile-actions-pills {
            display: flex;
            gap: 8px;
            width: 100%;
        }

        .pill-btn {
            flex: 1;
            background: #202020;
            border: 1px solid var(--yt-border);
            color: #ffffff;
            padding: 8px 4px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            text-decoration: none;
        }

        .pill-btn svg { width: 15px; height: 15px; fill: #ffffff; }

        .settings-menu-group {
            margin: 16px 16px 0;
            background: var(--yt-surface);
            border-radius: 16px;
            border: 1px solid var(--yt-border);
            overflow: hidden;
        }

        .group-label-header {
            padding: 14px 16px 8px;
            font-size: 12px;
            font-weight: 700;
            color: var(--yt-muted);
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        .menu-row-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            text-decoration: none;
            color: #ffffff;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        .menu-row-item:last-child { border-bottom: none; }

        .menu-left-block {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .menu-icon-wrap {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .menu-icon-wrap svg { width: 22px; height: 22px; fill: #ffffff; }

        .menu-title-text {
            font-size: 14px;
            font-weight: 500;
        }

        .menu-tag-pill {
            font-size: 11px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 12px;
            margin-left: 8px;
        }

        .tag-green { background: rgba(46, 204, 113, 0.15); color: var(--yt-green); }
        .tag-blue { background: rgba(62, 166, 255, 0.15); color: var(--yt-blue); }

        .menu-arrow-icon {
            width: 18px;
            height: 18px;
            fill: var(--yt-muted);
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="bt-header">
        <a href="../frontend/index.html" class="bt-logo-wrap">
            <div class="bt-logo-badge">
                <svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg>
            </div>
            <div class="bt-brand-name">Bharat<span>Tube</span></div>
        </a>
        <div style="display:flex; gap:16px;">
            <a href="contact.html" style="color:#fff; text-decoration:none;">
                <svg viewBox="0 0 24 24" style="width:22px; height:22px; fill:#fff;"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
            </a>
        </div>
    </header>

    <!-- Creator Hero -->
    <section class="profile-hero">
        <div class="profile-meta-row">
            <div class="creator-avatar-wrap">CB</div>
            <div class="creator-text-details">
                <div class="creator-title-row">
                    <h1>Charandas Bhaskar</h1>
                    <svg class="verified-badge-svg" id="partnerVerifiedBadge" viewBox="0 0 24 24">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                    </svg>
                </div>
                <div class="creator-handle">@charandas_creator • 245 subs</div>
            </div>
        </div>

        <div class="profile-actions-pills">
            <a href="upload.html" class="pill-btn">
                <svg viewBox="0 0 24 24"><path d="M9 16h6v-6h4l-7-7-7 7h4v6zm-4 2h14v2H5v-2z"/></svg>
                <span>Upload</span>
            </a>
            <a href="contact.html" class="pill-btn">
                <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
                <span>Support</span>
            </a>
        </div>
    </section>

    <!-- Partner Program & Policies (Direct Page Links) -->
    <section class="settings-menu-group">
        <div class="group-label-header">Partner Program & Policies</div>

        <!-- 1. Monetization Policy Page Link -->
        <a href="monetization-policy.html" class="menu-row-item">
            <div class="menu-left-block">
                <div class="menu-icon-wrap" style="color:var(--yt-green);">
                    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1.41 16.09V20h-2.67v-1.93c-1.71-.36-3.16-1.46-3.27-3.4h1.96c.1 1.05.82 1.87 2.12 1.87 1.39 0 2.05-.77 2.05-1.57 0-1.12-.9-1.63-2.69-2.07-2.12-.52-3.43-1.42-3.43-3.24 0-1.71 1.33-2.91 2.93-3.29V5h2.67v1.87c1.47.33 2.72 1.34 2.89 3.03h-1.96c-.16-.84-.79-1.54-1.89-1.54-1.15 0-1.88.66-1.88 1.49 0 .97.81 1.45 2.59 1.9 2.3.58 3.53 1.51 3.53 3.43 0 1.83-1.39 3.04-2.9 3.4z"/></svg>
                </div>
                <div class="menu-title-text">
                    Monetization Niyam (Earn)
                    <span class="menu-tag-pill tag-green">200 Subs Target</span>
                </div>
            </div>
            <svg class="menu-arrow-icon" viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
        </a>

        <!-- 2. Community Guidelines Page Link -->
        <a href="community-guidelines.html" class="menu-row-item">
            <div class="menu-left-block">
                <div class="menu-icon-wrap" style="color:var(--yt-blue);">
                    <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/></svg>
                </div>
                <div class="menu-title-text">Community Disha-Nirdesh</div>
            </div>
            <svg class="menu-arrow-icon" viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
        </a>

        <!-- 3. Copyright Page Link -->
        <a href="copyright.html" class="menu-row-item">
            <div class="menu-left-block">
                <div class="menu-icon-wrap" style="color:var(--yt-gold);">
                    <svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm0-14c-3.31 0-6 2.69-6 6s2.69 6 6 6c1.66 0 3.16-.67 4.24-1.76l-1.41-1.41C14.07 15.6 13.08 16 12 16c-2.21 0-4-1.79-4-4s1.79-4 4-4c1.08 0 2.07.4 2.83 1.17l1.41-1.41C15.16 6.67 13.66 6 12 6z"/></svg>
                </div>
                <div class="menu-title-text">
                    Copyright & Content ID
                    <span class="menu-tag-pill tag-blue">0 Strikes</span>
                </div>
            </div>
            <svg class="menu-arrow-icon" viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
        </a>

        <!-- 4. Contact & Support Page Link -->
        <a href="contact.html" class="menu-row-item">
            <div class="menu-left-block">
                <div class="menu-icon-wrap" style="color:var(--yt-blue);">
                    <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
                </div>
                <div class="menu-title-text">Sampark aur Sahayata (Support)</div>
            </div>
            <svg class="menu-arrow-icon" viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
        </a>
    </section>

    <!-- Central UI Scripts -->
    <script src="../assets/js/app-state.js"></script>
    <script src="../assets/js/ui-kit.js"></script>
</body>
</html>
