<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0f0f0f">
    <title>Profile & Creator Hub - BharatTube</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --yt-black: #0f0f0f;
            --yt-card: #181818;
            --yt-card-hover: #222222;
            --yt-border: rgba(255, 255, 255, 0.1);
            --yt-text: #ffffff;
            --yt-muted: #aaaaaa;
            --yt-blue: #3ea6ff;
            --yt-green: #2ecc71;
            --yt-gold: #f1c40f;
            --yt-red: #ff4e45;
        }

        html, body {
            width: 100%;
            min-height: 100%;
            background-color: var(--yt-black);
            color: var(--yt-text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
            padding-bottom: 80px;
        }

        .top-nav-bar {
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            position: sticky;
            top: 0;
            background: var(--yt-black);
            z-index: 100;
            border-bottom: 1px solid var(--yt-border);
        }

        .nav-back-link {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #ffffff;
            text-decoration: none;
            font-size: 16px;
            font-weight: 700;
        }

        .nav-back-link svg {
            width: 22px;
            height: 22px;
            fill: #ffffff;
        }

        .profile-hero {
            padding: 20px 16px 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .profile-meta-row {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .creator-avatar-wrap {
            width: 68px;
            height: 68px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff0000, #ff4e45);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: 800;
            color: #ffffff;
            flex-shrink: 0;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .creator-text-details h1 {
            font-size: 19px;
            font-weight: 700;
            line-height: 1.25;
        }

        .creator-handle {
            font-size: 13px;
            color: var(--yt-muted);
            margin: 3px 0 6px;
        }

        .profile-actions-pills {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .profile-actions-pills::-webkit-scrollbar {
            display: none;
        }

        .pill-btn {
            background: #222222;
            border: 1px solid var(--yt-border);
            color: #ffffff;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            white-space: nowrap;
            cursor: pointer;
        }

        .pill-btn svg {
            width: 16px;
            height: 16px;
            fill: #ffffff;
        }

        .settings-menu-group {
            margin: 16px 16px 0;
            background: var(--yt-card);
            border-radius: 16px;
            border: 1px solid var(--yt-border);
            overflow: hidden;
        }

        .group-label-header {
            padding: 12px 16px 6px;
            font-size: 12px;
            font-weight: 700;
            color: var(--yt-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .menu-row-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            text-decoration: none;
            color: #ffffff;
            cursor: pointer;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: background 0.15s;
        }

        .menu-row-item:last-child {
            border-bottom: none;
        }

        .menu-row-item:active {
            background: var(--yt-card-hover);
        }

        .menu-left-block {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .menu-icon-wrap {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .menu-icon-wrap svg {
            width: 22px;
            height: 22px;
            fill: #ffffff;
        }

        .menu-title-text {
            font-size: 14px;
            font-weight: 500;
        }

        .menu-tag-pill {
            font-size: 11px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 12px;
            margin-left: 8px;
        }

        .tag-green {
            background: rgba(46, 204, 113, 0.15);
            color: var(--yt-green);
            border: 1px solid rgba(46, 204, 113, 0.3);
        }

        .tag-blue {
            background: rgba(62, 166, 255, 0.15);
            color: var(--yt-blue);
            border: 1px solid rgba(62, 166, 255, 0.3);
        }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            z-index: 1000;
            align-items: flex-end;
            justify-content: center;
        }

        .bottom-sheet-card {
            width: 100%;
            max-width: 520px;
            background: #1e1e1e;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            border: 1px solid var(--yt-border);
            max-height: 85vh;
            overflow-y: auto;
            padding: 20px 18px max(24px, env(safe-area-inset-bottom, 24px));
        }

        .metric-card {
            background: #141414;
            border: 1px solid var(--yt-border);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px;
        }

        .metric-top-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .metric-progress-bar {
            height: 8px;
            background: #2a2a2a;
            border-radius: 4px;
            overflow: hidden;
        }

        .metric-fill {
            height: 100%;
            background: var(--yt-blue);
            border-radius: 4px;
        }

        .policy-item {
            background: #141414;
            border: 1px solid var(--yt-border);
            border-radius: 12px;
            padding: 12px 14px;
            margin-bottom: 10px;
        }

        .policy-item h4 {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .policy-item p {
            font-size: 12px;
            color: var(--yt-muted);
            line-height: 1.45;
        }

        .sheet-done-action-btn {
            width: 100%;
            background: var(--yt-blue);
            color: #000;
            border: none;
            border-radius: 24px;
            padding: 12px 0;
            font-size: 14px;
            font-weight: 700;
            margin-top: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header class="top-nav-bar">
        <a href="../frontend/index.html" class="nav-back-link">
            <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            <span>Home</span>
        </a>
    </header>

    <section class="profile-hero">
        <div class="profile-meta-row">
            <div class="creator-avatar-wrap">CB</div>
            <div class="creator-text-details">
                <h1>Charandas Bhaskar</h1>
                <div class="creator-handle">@charandas_creator • 45.2K subs</div>
            </div>
        </div>
        <div class="profile-actions-pills">
            <a href="upload.html" class="pill-btn">
                <svg viewBox="0 0 24 24"><path d="M9 16h6v-6h4l-7-7-7 7h4v6zm-4 2h14v2H5v-2z"/></svg>
                <span>Upload / Create</span>
            </a>
        </div>
    </section>

    <!-- NEW SECTION: Monetization, Copyright, Community Guidelines -->
    <section class="settings-menu-group">
        <div class="group-label-header">Partner Program & Rules</div>

        <!-- 1. Monetization -->
        <div class="menu-row-item" onclick="openPolicyModal('monetization')">
            <div class="menu-left-block">
                <div class="menu-icon-wrap" style="color:var(--yt-green);">
                    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1.41 16.09V20h-2.67v-1.93c-1.71-.36-3.16-1.46-3.27-3.4h1.96c.1 1.05.82 1.87 2.12 1.87 1.39 0 2.05-.77 2.05-1.57 0-1.12-.9-1.63-2.69-2.07-2.12-.52-3.43-1.42-3.43-3.24 0-1.71 1.33-2.91 2.93-3.29V5h2.67v1.87c1.47.33 2.72 1.34 2.89 3.03h-1.96c-.16-.84-.79-1.54-1.89-1.54-1.15 0-1.88.66-1.88 1.49 0 .97.81 1.45 2.59 1.9 2.3.58 3.53 1.51 3.53 3.43 0 1.83-1.39 3.04-2.9 3.4z"/></svg>
                </div>
                <div>
                    <span class="menu-title-text">Monetization & Earn</span>
                    <span class="menu-tag-pill tag-green">Live Tracker</span>
                </div>
            </div>
            <span>></span>
        </div>

        <!-- 2. Copyright -->
        <div class="menu-row-item" onclick="openPolicyModal('copyright')">
            <div class="menu-left-block">
                <div class="menu-icon-wrap" style="color:var(--yt-gold);">
                    <svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm0-14c-3.31 0-6 2.69-6 6s2.69 6 6 6c1.66 0 3.16-.67 4.24-1.76l-1.41-1.41C14.07 15.6 13.08 16 12 16c-2.21 0-4-1.79-4-4s1.79-4 4-4c1.08 0 2.07.4 2.83 1.17l1.41-1.41C15.16 6.67 13.66 6 12 6z"/></svg>
                </div>
                <div>
                    <span class="menu-title-text">Copyright & Content ID</span>
                    <span class="menu-tag-pill tag-blue">0 Strikes</span>
                </div>
            </div>
            <span>></span>
        </div>

        <!-- 3. Community Guidelines -->
        <div class="menu-row-item" onclick="openPolicyModal('guidelines')">
            <div class="menu-left-block">
                <div class="menu-icon-wrap" style="color:var(--yt-blue);">
                    <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/></svg>
                </div>
                <div>
                    <span class="menu-title-text">Community Guidelines</span>
                    <span class="menu-tag-pill tag-green">Good Standing</span>
                </div>
            </div>
            <span>></span>
        </div>
    </section>

    <!-- Standard Channel Tools -->
    <section class="settings-menu-group">
        <div class="group-label-header">Channel Tools</div>
        <a href="channel.html" class="menu-row-item">
            <div class="menu-left-block">
                <span class="menu-title-text">Your channel</span>
            </div>
            <span>></span>
        </a>
        <a href="upload.html" class="menu-row-item">
            <div class="menu-left-block">
                <span class="menu-title-text">BharatTube Studio / Upload</span>
            </div>
            <span>></span>
        </a>
    </section>

    <!-- Bottom Sheet Modal -->
    <div class="modal-overlay" id="policyModal">
        <div class="bottom-sheet-card">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
                <h3 id="modalHeading">Details</h3>
                <button onclick="closePolicyModal()" style="background:none; border:none; color:#fff; font-size:20px; cursor:pointer;">✕</button>
            </div>
            <div id="modalBody"></div>
            <button class="sheet-done-action-btn" onclick="closePolicyModal()">Done</button>
        </div>
    </div>

    <script>
        function openPolicyModal(type) {
            const modal = document.getElementById('policyModal');
            const heading = document.getElementById('modalHeading');
            const body = document.getElementById('modalBody');

            if (type === 'monetization') {
                heading.textContent = 'Monetization Criteria (Earn)';
                body.innerHTML = `
                    <div class="metric-card">
                        <div class="metric-top-row">
                            <span>Subscribers</span>
                            <span style="color:var(--yt-green);">45,200 / 1,000 (Eligible ✓)</span>
                        </div>
                        <div class="metric-progress-bar">
                            <div class="metric-fill" style="width:100%; background:var(--yt-green);"></div>
                        </div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-top-row">
                            <span>Public Watch Hours</span>
                            <span>3,210 / 4,000 hrs (80%)</span>
                        </div>
                        <div class="metric-progress-bar">
                            <div class="metric-fill" style="width:80%;"></div>
                        </div>
                    </div>
                    <div style="background:#141414; padding:12px; border-radius:10px; font-size:12px; color:var(--yt-muted);">
                        🔒 2-Step Verification: On<br>
                        🚫 Community Strikes: 0 Active (Eligible)
                    </div>
                `;
            } else if (type === 'copyright') {
                heading.textContent = 'Copyright & Strikes';
                body.innerHTML = `
                    <div class="policy-item" style="border-left:4px solid var(--yt-green);">
                        <h4>Channel Status: 0 Copyright Strikes</h4>
                        <p>Aapke channel par koi copyright strike nahi hai. Saara content fair use ke andar hai.</p>
                    </div>
                    <div class="policy-item">
                        <h4>3-Strike Rule</h4>
                        <p>90 din ke andar 3 strikes aane par channel suspend ho jata hai.</p>
                    </div>
                `;
            } else if (type === 'guidelines') {
                heading.textContent = 'Community Guidelines';
                body.innerHTML = `
                    <div class="policy-item" style="border-left:4px solid var(--yt-green);">
                        <h4>Community Health: Good Standing</h4>
                        <p>Aapka channel safe aur verified state me hai.</p>
                    </div>
                    <div class="policy-item">
                        <h4>Spam & Deception</h4>
                        <p>Misleading titles ya thumbnails lagana strictly prohibited hai.</p>
                    </div>
                `;
            }
            modal.style.display = 'flex';
        }

        function closePolicyModal() {
            document.getElementById('policyModal').style.display = 'none';
        }
    </script>
</body>
</html>
