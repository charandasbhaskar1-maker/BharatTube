<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>Create - BharatTube</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000000;
            color: #ffffff;
        }

        /* =========================================================
           VIEW 1: YOUTUBE CAMERA RECORDER SCREEN (Screenshot 1)
           ========================================================= */
        #cameraView {
            position: fixed;
            inset: 0;
            background: #000000;
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        /* Live Camera Feed */
        #cameraVideoPreview {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        /* Top Controls */
        .cam-top-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 20;
            background: linear-gradient(180deg, rgba(0,0,0,0.6) 0%, transparent 100%);
        }

        .cam-btn-circle {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(0,0,0,0.45);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            color: #ffffff;
            cursor: pointer;
            text-decoration: none;
        }

        .cam-btn-circle svg {
            width: 20px;
            height: 20px;
            fill: #ffffff;
        }

        .cam-sound-pill {
            background: rgba(0,0,0,0.55);
            backdrop-filter: blur(8px);
            border-radius: 20px;
            padding: 7px 16px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 600;
            border: none;
            color: #ffffff;
            cursor: pointer;
        }

        .cam-sound-pill svg {
            width: 16px;
            height: 16px;
            fill: #ffffff;
        }

        .cam-magic-btn {
            background: radial-gradient(circle, #e91e63, #9c27b0);
            box-shadow: 0 0 10px rgba(233, 30, 99, 0.6);
        }

        /* Right Floating Tool Rail */
        .cam-right-rail {
            position: absolute;
            right: 12px;
            top: 130px;
            background: rgba(0,0,0,0.45);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 12px 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            z-index: 20;
        }

        .tool-btn {
            background: none;
            border: none;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            cursor: pointer;
        }

        .tool-btn svg {
            width: 22px;
            height: 22px;
            fill: #ffffff;
        }

        .tool-label {
            font-size: 12px;
            font-weight: 700;
        }

        /* Bottom Shutter & Gallery */
        .cam-bottom-box {
            position: absolute;
            bottom: 60px;
            left: 0;
            right: 0;
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 20;
        }

        .gallery-add-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        .gallery-thumb-slot {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: #222222;
            border: 2px solid #ffffff;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gallery-thumb-slot svg {
            width: 20px;
            height: 20px;
            fill: #ffffff;
        }

        .gallery-label {
            font-size: 12px;
            font-weight: 600;
        }

        /* Big Red Record Shutter Button */
        .record-shutter-ring {
            width: 76px;
            height: 76px;
            border-radius: 50%;
            border: 4px solid #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.15s ease;
        }

        .record-shutter-ring:active {
            transform: scale(0.92);
        }

        .record-red-core {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: #ff0033;
            transition: all 0.2s ease;
        }

        .record-shutter-ring.recording .record-red-core {
            border-radius: 8px;
            width: 32px;
            height: 32px;
        }

        /* Bottom Mode Switcher Strip */
        .cam-mode-strip {
            position: absolute;
            bottom: 12px;
            left: 0;
            right: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
            z-index: 20;
        }

        .mode-tab {
            font-size: 14px;
            font-weight: 600;
            color: #888888;
            cursor: pointer;
        }

        .mode-tab.active {
            background: rgba(255,255,255,0.22);
            color: #ffffff;
            padding: 6px 18px;
            border-radius: 20px;
            backdrop-filter: blur(6px);
        }


        /* =========================================================
           VIEW 2: ADD DETAILS SCREEN (Screenshot 2)
           ========================================================= */
        #detailsView {
            position: fixed;
            inset: 0;
            background: #0f0f0f;
            display: none;
            flex-direction: column;
            z-index: 50;
            overflow-y: auto;
            padding-bottom: 75px;
        }

        .yt-upload-header {
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            position: sticky;
            top: 0;
            background: #0f0f0f;
            z-index: 100;
            border-bottom: 1px solid #272727;
        }

        .btn-next-upload {
            background: #3ea6ff;
            color: #0f0f0f;
            border: none;
            padding: 6px 18px;
            border-radius: 18px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }

        .yt-hero-section {
            padding: 16px;
            display: flex;
            gap: 14px;
            border-bottom: 1px solid #212121;
        }

        .media-preview-box {
            width: 105px;
            height: 140px;
            border-radius: 10px;
            background: #1c1c1c;
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
            border: 1px solid #333333;
        }

        .media-preview-box video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .thumb-overlay-btn {
            position: absolute;
            top: 6px;
            left: 6px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.65);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .thumb-overlay-btn svg {
            width: 16px;
            height: 16px;
            fill: #ffffff;
        }

        .hero-title-side {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .channel-chip-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .channel-avatar-sm {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #e50914;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 800;
            color: #fff;
        }

        .channel-name-sm {
            font-size: 13px;
            color: #aaaaaa;
            font-weight: 500;
        }

        .input-title-area {
            width: 100%;
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            resize: none;
            height: 75px;
            line-height: 1.4;
        }

        .input-title-area::placeholder {
            color: #717171;
        }

        .desc-box-wrapper {
            padding: 14px 16px;
            border-bottom: 1px solid #1f1f1f;
        }

        .desc-textarea {
            width: 100%;
            background: #181818;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            color: #ffffff;
            font-size: 13px;
            padding: 10px;
            outline: none;
            resize: none;
            height: 60px;
        }

        .yt-list-item {
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #1f1f1f;
            cursor: pointer;
        }

        .item-left-block {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .item-icon-box svg {
            width: 22px;
            height: 22px;
            fill: #ffffff;
        }

        .item-text-wrap {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .item-primary-text {
            font-size: 14px;
            font-weight: 500;
        }

        .item-secondary-text {
            font-size: 12px;
            color: #aaaaaa;
        }

        .item-arrow-right svg {
            width: 18px;
            height: 18px;
            fill: #717171;
        }

        /* Bottom Nav */
        .bottom-nav-fixed {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 56px;
            background: #0f0f0f;
            display: flex;
            align-items: center;
            justify-content: space-around;
            border-top: 1px solid #272727;
            z-index: 1000;
        }

        .nav-link-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 10px;
            color: #aaaaaa;
            text-decoration: none;
            gap: 3px;
        }

        .nav-link-btn svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        .nav-btn-plus {
            background: #ffffff;
            border-radius: 50%;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #0f0f0f;
            text-decoration: none;
        }

        .nav-btn-plus svg {
            width: 22px;
            height: 22px;
            fill: #0f0f0f;
        }
    </style>
</head>
<body>

    <!-- Hidden Native File Input -->
    <input type="file" id="galleryFileInput" accept="video/*" style="display:none;" onchange="handleFileSelected(event)">

    <!-- ==========================================
         VIEW 1: YOUTUBE SHORTS CAMERA (Screenshot 1)
         ========================================== -->
    <section id="cameraView">
        <video id="cameraVideoPreview" autoplay playsinline muted></video>

        <!-- Top Bar -->
        <div class="cam-top-bar">
            <a href="../index.html" class="cam-btn-circle">
                <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
            </a>
            <button class="cam-sound-pill" onclick="alert('Choose Sound: Folk banjos, Trending tracks')">
                <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
                <span>Add sound</span>
            </button>
            <div class="cam-btn-circle cam-magic-btn" onclick="alert('Filters & Effects enabled!')">
                <svg viewBox="0 0 24 24"><path d="M7 14c-1.66 0-3 1.34-3 3 0 1.31-1.16 2-2 2 .92 1.22 2.49 2 4 2 2.21 0 4-1.79 4-4 0-1.66-1.34-3-3-3zm13.71-9.71a.996.996 0 0 0-1.41 0L14.7 8.88l1.42 1.42 4.59-4.59c.39-.39.39-1.02 0-1.42z"/></svg>
            </div>
        </div>

        <!-- Right Side Tool Rail -->
        <aside class="cam-right-rail">
            <button class="tool-btn" onclick="toggleCameraFacing()">
                <svg viewBox="0 0 24 24"><path d="M9 12c0 1.66 1.34 3 3 3s3-1.34 3-3-1.34-3-3-3-3 1.34-3 3zm12-4h-3.17l-1.86-2H8.03l-1.86 2H3c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2z"/></svg>
            </button>
            <button class="tool-btn" onclick="alert('Timer set to 3s')">
                <svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
            </button>
            <button class="tool-btn" onclick="toggleDuration(this)">
                <span class="tool-label" id="durationLabel">15 s</span>
            </button>
            <button class="tool-btn" onclick="alert('Beautify on')">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 14.5v-9l6 4.5-6 4.5z"/></svg>
            </button>
            <button class="tool-btn" onclick="alert('Speed 1x')">
                <span class="tool-label">1x</span>
            </button>
            <button class="tool-btn" onclick="alert('Green screen mode')">
                <svg viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
            </button>
        </aside>

        <!-- Bottom Shutter Strip -->
        <div class="cam-bottom-box">
            <div class="gallery-add-box" onclick="document.getElementById('galleryFileInput').click()">
                <div class="gallery-thumb-slot">
                    <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                </div>
                <span class="gallery-label">Add</span>
            </div>

            <!-- Big Red Shutter -->
            <div class="record-shutter-ring" id="recordShutter" onclick="toggleRecording()">
                <div class="record-red-core"></div>
            </div>

            <div style="width:44px;"></div>
        </div>

        <!-- Mode Strip -->
        <div class="cam-mode-strip">
            <span class="mode-tab">Video</span>
            <span class="mode-tab active">Short</span>
            <span class="mode-tab">Live</span>
            <span class="mode-tab">Post</span>
        </div>
    </section>


    <!-- ==========================================
         VIEW 2: ADD DETAILS SCREEN (Screenshot 2)
         ========================================== -->
    <section id="detailsView">
        <header class="yt-upload-header">
            <div style="display:flex; align-items:center; gap:16px;">
                <button class="btn-back-arrow" onclick="showCameraView()" style="background:none; border:none; color:#fff; cursor:pointer;">
                    <svg viewBox="0 0 24 24" style="width:22px; height:22px; fill:#fff;"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
                </button>
                <span style="font-size:18px; font-weight:700;">Add details</span>
            </div>
            <button class="btn-next-upload" onclick="publishUpload()">Next</button>
        </header>

        <div class="yt-hero-section">
            <div class="media-preview-box">
                <video id="finalDetailsPreview" playsinline loop muted autoplay></video>
                <div class="thumb-overlay-btn" onclick="document.getElementById('galleryFileInput').click()">
                    <svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
                </div>
            </div>

            <div class="hero-title-side">
                <div class="channel-chip-row">
                    <div class="channel-avatar-sm">CB</div>
                    <span class="channel-name-sm">Charandas Bhaskar</span>
                </div>
                <textarea class="input-title-area" id="detailTitleInput" placeholder="Create a title (type '@' to mention a channel)"></textarea>
            </div>
        </div>

        <div class="desc-box-wrapper">
            <textarea class="desc-textarea" placeholder="Add description (#tags, credits)"></textarea>
        </div>

        <div class="yt-list-item" onclick="toggleVisibility()">
            <div class="item-left-block">
                <div class="item-icon-box">
                    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
                </div>
                <div class="item-text-wrap">
                    <span class="item-primary-text">Visibility</span>
                    <span class="item-secondary-text" id="visStatus">Public</span>
                </div>
            </div>
            <div class="item-arrow-right">
                <svg viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg>
            </div>
        </div>

        <div class="yt-list-item" onclick="alert('Audience set to: No, it is not made for kids')">
            <div class="item-left-block">
                <div class="item-icon-box">
                    <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                </div>
                <div class="item-text-wrap">
                    <span class="item-primary-text">Audience</span>
                    <span class="item-secondary-text">No, it\'s not made for kids</span>
                </div>
            </div>
            <div class="item-arrow-right">
                <svg viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg>
            </div>
        </div>

        <div class="yt-list-item" onclick="alert('Remixing Allowed')">
            <div class="item-left-block">
                <div class="item-icon-box">
                    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14.5v-9l6 4.5-6 4.5z"/></svg>
                </div>
                <div class="item-text-wrap">
                    <span class="item-primary-text">Shorts remixing</span>
                    <span class="item-secondary-text">Allow video and audio remixing</span>
                </div>
            </div>
            <div class="item-arrow-right">
                <svg viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg>
            </div>
        </div>

        <div class="yt-list-item" onclick="promptLoc()">
            <div class="item-left-block">
                <div class="item-icon-box">
                    <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
                </div>
                <div class="item-text-wrap">
                    <span class="item-primary-text">Location</span>
                    <span class="item-secondary-text" id="locStatus">None</span>
                </div>
            </div>
            <div class="item-arrow-right">
                <svg viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg>
            </div>
        </div>
    </section>

    <!-- Bottom Nav -->
    <nav class="bottom-nav-fixed">
        <a href="../index.html" class="nav-link-btn">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>

        <a href="shorts.html" class="nav-link-btn">

        <a href="upload.html" class="nav-btn-plus">

        </a>
        <a href="channel.html" class="nav-link-btn">
            <svg viewBox="0 0 24 24"><path d="M20 8H4V6h16v2zm-2-6H6v2h12V2zm4 10v8c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2v-8c0-1.1.9-2 2-2h16c1.1 0 2 .9 2 2zm-6 4l-6-3.27v6.53L16 16z"/></svg>
            <span>Subscriptions</span>
        </a>
        <a href="profile.html" class="nav-link-btn">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>
            <span>You</span>
        </a>
    </nav>

    <script>
        let stream = null;
        let isFront = false;

        // Auto Start Camera (YouTube Studio Reel Mode)
        async function initCamera() {
            try {
                if (stream) stream.getTracks().forEach(t => t.stop());
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: isFront ? 'user' : 'environment' },
                    audio: false
                });
                document.getElementById('cameraVideoPreview').srcObject = stream;
            } catch (err) {
                console.log('Camera permission fallback: using demo stream');
                document.getElementById('cameraVideoPreview').src = "https://assets.mixkit.co/videos/preview/mixkit-forest-stream-in-the-sunlight-529-large.mp4";
                document.getElementById('cameraVideoPreview').loop = true;
            }
        }
        initCamera();

        function toggleCameraFacing() {
            isFront = !isFront;
            initCamera();
        }

        function toggleDuration(btn) {
            const label = document.getElementById('durationLabel');
            label.innerText = label.innerText === '15 s' ? '60 s' : '15 s';
        }

        // Shutter Button Logic -> Direct moves to Details view
        let isRecording = false;
        function toggleRecording() {
            const shutter = document.getElementById('recordShutter');
            if (!isRecording) {
                isRecording = true;
                shutter.classList.add('recording');
                setTimeout(() => {
                    stopAndMoveToDetails();
                }, 3500); // 3.5s simulate clip record
            }
        }

        function stopAndMoveToDetails(srcUrl) {
            const camView = document.getElementById('cameraView');
            const detView = document.getElementById('detailsView');
            const player = document.getElementById('finalDetailsPreview');

            camView.style.display = 'none';
            detView.style.display = 'flex';

            player.src = srcUrl || "https://assets.mixkit.co/videos/preview/mixkit-forest-stream-in-the-sunlight-529-large.mp4";
            document.getElementById('detailTitleInput').value = "BharatTube Shorts #" + Math.floor(Math.random()*1000);
        }

        // Handle Gallery Selection
        function handleFileSelected(e) {
            const file = e.target.files[0];
            if (!file) return;
            const url = URL.createObjectURL(file);
            stopAndMoveToDetails(url);
        }

        function showCameraView() {
            document.getElementById('detailsView').style.display = 'none';
            document.getElementById('cameraView').style.display = 'flex';
            document.getElementById('recordShutter').classList.remove('recording');
            isRecording = false;
        }

        let visibilities = ['Public', 'Unlisted', 'Private'];
        let vIdx = 0;
        function toggleVisibility() {
            vIdx = (vIdx + 1) % 3;
            document.getElementById('visStatus').innerText = visibilities[vIdx];
        }

        function promptLoc() {
            const loc = prompt('Enter Location:', 'Chhattisgarh, India');
            if (loc) document.getElementById('locStatus').innerText = loc;
        }

        function publishUpload() {
            alert('Video Uploaded Successfully to BharatTube!');
            window.location.href = '../index.html';
        }
    </script>
</body>
</html>
