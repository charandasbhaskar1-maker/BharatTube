<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>BharatTube Studio - Fast Upload & Create</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --yt-black: #000000;
            --yt-panel: #161616;
            --yt-panel2: #222222;
            --yt-border: rgba(255, 255, 255, 0.14);
            --yt-text: #ffffff;
            --yt-muted: #aaaaaa;
            --yt-blue: #3ea6ff;
            --yt-red: #ff0000;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
            position: fixed;
            transform: translate3d(0, 0, 0);
            -webkit-font-smoothing: antialiased;
        }

        .app-viewport {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            position: relative;
            background: #000000;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Camera / Screencast Layer */
        .camera-background {
            position: absolute;
            inset: 0;
            z-index: 1;
            background: #080808;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .camera-background video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Top Action Bar */
        .top-action-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 50;
            height: calc(54px + env(safe-area-inset-top, 0px));
            padding: env(safe-area-inset-top, 8px) 16px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(to bottom, rgba(0,0,0,0.65) 0%, transparent 100%);
        }

        .circle-icon-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            text-decoration: none;
            font-size: 18px;
        }

        .circle-icon-btn svg {
            width: 20px;
            height: 20px;
            fill: #ffffff;
        }

        .add-sound-pill {
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #ffffff;
            padding: 7px 18px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .add-sound-pill svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        /* Right Sidebar Tools */
        .side-tool-column {
            position: absolute;
            right: 12px;
            top: calc(68px + env(safe-area-inset-top, 0px));
            z-index: 50;
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: flex-end;
            max-height: calc(100vh - 240px);
            overflow-y: auto;
            scrollbar-width: none;
        }

        .side-tool-column::-webkit-scrollbar {
            display: none;
        }

        .tool-action-item {
            display: flex;
            align-items: center;
            gap: 8px;
            background: transparent;
            border: none;
            color: #ffffff;
            cursor: pointer;
        }

        .tool-title {
            font-size: 13px;
            font-weight: 600;
            text-shadow: 0 1px 4px rgba(0,0,0,0.9);
            white-space: nowrap;
        }

        .tool-round-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 13px;
            font-weight: 700;
            color: #ffffff;
        }

        .tool-round-btn svg {
            width: 20px;
            height: 20px;
            fill: #ffffff;
        }

        /* Bottom Deck */
        .bottom-control-deck {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 60;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            padding-bottom: max(16px, env(safe-area-inset-bottom, 16px));
            background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.6) 65%, transparent 100%);
        }

        .live-preview-info {
            width: 100%;
            padding: 0 24px;
            display: none;
            flex-direction: column;
            gap: 6px;
            align-items: center;
        }

        .live-creator-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0,0,0,0.65);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid var(--yt-border);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .pencil-edit-icon {
            width: 16px;
            height: 16px;
            fill: var(--yt-blue);
            margin-left: 4px;
        }

        .capture-row {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 0 20px;
        }

        .gallery-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            width: 50px;
        }

        .gallery-preview-mini {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            border: 2px solid #ffffff;
            background: #181818;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gallery-preview-mini img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .gallery-box span {
            font-size: 11px;
            font-weight: 700;
            text-shadow: 0 1px 3px rgba(0,0,0,0.9);
        }

        .shutter-outer-ring {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            border: 4px solid #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            background: rgba(0,0,0,0.2);
            transition: transform 0.12s ease;
        }

        .shutter-inner-red {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: #ff0000;
            transition: 0.15s ease;
        }

        .shutter-outer-ring.recording .shutter-inner-red {
            border-radius: 8px;
            width: 28px;
            height: 28px;
        }

        .live-btn-stack {
            display: none;
            width: 100%;
            padding: 0 20px;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .big-pill-btn {
            width: 100%;
            max-width: 320px;
            background: #ffffff;
            color: #000000;
            border: none;
            border-radius: 28px;
            padding: 12px 0;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 4px 14px rgba(0,0,0,0.5);
        }

        .practice-mode-btn {
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-shadow: 0 1px 4px rgba(0,0,0,0.8);
        }

        /* Mode Selector */
        .mode-scroll-deck {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: rgba(0, 0, 0, 0.7);
            padding: 5px 12px;
            border-radius: 30px;
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            width: fit-content;
        }

        .mode-chip {
            font-size: 13px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            padding: 6px 14px;
            border-radius: 18px;
            transition: 0.15s ease;
            white-space: nowrap;
        }

        .mode-chip.active {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.28);
        }

        /* YouTube Live Edit Bottom Sheet (Pencil Modal) */
        .live-edit-sheet-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            z-index: 200;
            align-items: flex-end;
            justify-content: center;
        }

        .live-edit-sheet {
            width: 100%;
            max-width: 500px;
            background: #1e1e1e;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            padding: 20px 18px max(24px, env(safe-area-inset-bottom, 24px));
            border-top: 1px solid var(--yt-border);
            max-height: 85vh;
            overflow-y: auto;
        }

        .sheet-title-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .sheet-title-row h3 {
            font-size: 16px;
            font-weight: 700;
        }

        .sheet-field-group {
            margin-bottom: 14px;
        }

        .sheet-field-label {
            font-size: 12px;
            color: var(--yt-muted);
            margin-bottom: 6px;
            display: block;
        }

        .sheet-text-input {
            width: 100%;
            background: #121212;
            border: 1px solid var(--yt-border);
            border-radius: 10px;
            padding: 10px 14px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            font-family: inherit;
        }

        .sheet-textarea {
            width: 100%;
            min-height: 60px;
            background: #121212;
            border: 1px solid var(--yt-border);
            border-radius: 10px;
            padding: 10px 14px;
            color: #ffffff;
            font-size: 13px;
            outline: none;
            resize: none;
            font-family: inherit;
        }

        .thumb-upload-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 6px;
        }

        .live-thumb-preview {
            width: 80px;
            aspect-ratio: 16 / 9;
            background: #121212;
            border: 1px dashed var(--yt-border);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .live-thumb-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .sheet-done-btn {
            width: 100%;
            background: var(--yt-blue);
            color: #000;
            border: none;
            border-radius: 20px;
            padding: 12px 0;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
        }

        /* Turbo Upload Overlay */
        .upload-hud-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.88);
            backdrop-filter: blur(14px);
            z-index: 50000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .upload-hud-card {
            width: 100%;
            max-width: 400px;
            background: var(--yt-panel);
            border: 1px solid var(--yt-border);
            border-radius: 20px;
            padding: 24px 20px;
            text-align: center;
        }

        .turbo-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(62, 166, 255, 0.15);
            color: var(--yt-blue);
            border: 1px solid var(--yt-blue);
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 12px;
            margin-bottom: 12px;
        }

        .hud-progress-track {
            height: 8px;
            background: #252525;
            border-radius: 6px;
            overflow: hidden;
            margin: 16px 0 10px;
        }

        .hud-progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #3ea6ff, #2ecc71);
            border-radius: 6px;
            transition: width 0.08s linear;
        }

        /* Post Screen Modal */
        .post-fullscreen-modal {
            display: none;
            position: absolute;
            inset: 0;
            background: #000000;
            z-index: 100;
            flex-direction: column;
            justify-content: space-between;
        }

        .post-inner-content {
            padding: 16px;
        }

        .post-author-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;
        }

        .post-author-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: linear-gradient(135deg, #11998e, #38ef7d);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 16px;
            color: #ffffff;
        }

        .post-textarea-main {
            width: 100%;
            min-height: 140px;
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 16px;
            font-family: inherit;
            outline: none;
            resize: none;
            line-height: 1.45;
        }

        .post-textarea-main::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .attached-post-img-box {
            position: relative;
            margin: 10px 0;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--yt-border);
            display: none;
            max-height: 200px;
        }

        .attached-post-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .remove-attach-cross {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0,0,0,0.7);
            border: none;
            color: white;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .post-bottom-suite {
            padding-bottom: max(16px, env(safe-area-inset-bottom, 16px));
        }

        .post-gallery-strip {
            display: flex;
            gap: 8px;
            padding: 0 16px 12px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .post-gallery-strip::-webkit-scrollbar {
            display: none;
        }

        .strip-card {
            width: 66px;
            height: 66px;
            border-radius: 8px;
            background: #181818;
            border: 1px solid var(--yt-border);
            flex-shrink: 0;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .strip-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .post-tools-tray {
            display: flex;
            align-items: center;
            gap: 26px;
            padding: 12px 18px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .tray-icon-btn {
            background: none;
            border: none;
            color: #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
        }

        .tray-icon-btn svg {
            width: 24px;
            height: 24px;
            fill: #ffffff;
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 84px;
            transform: translate(-50%, 20px);
            background: #ffffff;
            color: #000000;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            opacity: 0;
            pointer-events: none;
            transition: 0.2s ease;
            z-index: 60000;
            white-space: nowrap;
        }

        .toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }
    </style>
</head>
<body>

    <!-- Native File Pickers -->
    <input type="file" id="videoPicker" accept="video/*" style="display:none;" onchange="startTurboChunkUpload(event)">
    <input type="file" id="postImagePicker" accept="image/*" style="display:none;" onchange="loadPostImage(event)">
    <input type="file" id="liveThumbPicker" accept="image/*" style="display:none;" onchange="loadLiveThumbnail(event)">

    <div class="app-viewport">

        <!-- CAMERA LAYER -->
        <div class="camera-background" id="cameraBackground">
            <video id="liveCameraFeed" autoplay playsinline muted></video>
        </div>

        <!-- TOP BAR -->
        <header class="top-action-bar">
            <a href="../frontend/index.html" class="circle-icon-btn">✕</a>

            <div class="add-sound-pill" id="topSoundPill" onclick="selectMusicTrack()">
                <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
                <span id="soundLabel">Add sound</span>
            </div>

            <div class="circle-icon-btn" onclick="showToast('Effects & Highlights ready ✨')">
                <svg viewBox="0 0 24 24"><path d="M19 9l1.25-2.75L23 5l-2.75-1.25L19 1l-1.25 2.75L15 5l2.75 1.25L19 9zm-7.5.5L9 4 6.5 9.5 1 12l5.5 2.5L9 20l2.5-5.5L17 12l-5.5-2.5zM19 15l-1.25 2.75L15 19l2.75 1.25L19 23l1.25-2.75L23 19l-2.75-1.25L19 15z"/></svg>
            </div>
        </header>

        <!-- RIGHT TOOLS -->
        <div class="side-tool-column" id="sideToolColumn"></div>

        <!-- BOTTOM DECK -->
        <div class="bottom-control-deck">

            <!-- Live Creator Details Pill (With Pencil Icon) -->
            <div class="live-preview-info" id="livePreviewInfo">
                <div class="live-creator-badge" onclick="openLiveEditSheet()">
                    <span style="color:#2ecc71;">●</span>
                    <span id="liveBadgeTitle">Charandas Bhaskar • Public</span>
                    <!-- YouTube Pencil Icon -->
                    <svg class="pencil-edit-icon" viewBox="0 0 24 24">
                        <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/>
                    </svg>
                </div>
            </div>

            <!-- Standard Video/Shorts Capture Row -->
            <div class="capture-row" id="captureRow">
                <div class="gallery-box" onclick="document.getElementById('videoPicker').click()">
                    <div class="gallery-preview-mini">
                        <img src="https://images.unsplash.com/photo-1524492412937-b28074a5d7da?w=100" alt="Gallery">
                    </div>
                    <span>Add</span>
                </div>

                <div class="shutter-outer-ring" id="shutterBtn" onclick="toggleRecording()">
                    <div class="shutter-inner-red"></div>
                </div>

                <div style="width: 50px;"></div>
            </div>

            <!-- Live Action Stack -->
            <div class="live-btn-stack" id="liveBtnStack">
                <button class="big-pill-btn" onclick="handleLiveNext()">Next</button>
                <button class="practice-mode-btn" onclick="showToast('Practice mode on (Device cool)')">Practice mode</button>
            </div>

            <!-- Mode Selector -->
            <nav class="mode-scroll-deck">
                <span class="mode-chip" id="modeVideo" onclick="switchMode('video')">Video</span>
                <span class="mode-chip active" id="modeShort" onclick="switchMode('short')">Short</span>
                <span class="mode-chip" id="modeLive" onclick="switchMode('live')">Live</span>
                <span class="mode-chip" id="modePost" onclick="switchMode('post')">Post</span>
            </nav>
        </div>

        <!-- LIVE STREAM SETTINGS SHEET (PENCIL ICON MODAL) -->
        <div class="live-edit-sheet-backdrop" id="liveEditModal">
            <div class="live-edit-sheet">
                <div class="sheet-title-row">
                    <h3>Live Stream Details ✏️</h3>
                    <span onclick="closeLiveEditSheet()" style="cursor:pointer; font-size:18px;">✕</span>
                </div>

                <!-- Title Input -->
                <div class="sheet-field-group">
                    <label class="sheet-field-label">Stream Title</label>
                    <input type="text" class="sheet-text-input" id="liveStreamTitleInput" value="Charandas Bhaskar Live Stream" placeholder="What's your stream about?">
                </div>

                <!-- Description Input -->
                <div class="sheet-field-group">
                    <label class="sheet-field-label">Description</label>
                    <textarea class="sheet-textarea" id="liveStreamDescInput" placeholder="Tell viewers about this live session..."></textarea>
                </div>

                <!-- Visibility -->
                <div class="sheet-field-group">
                    <label class="sheet-field-label">Visibility</label>
                    <select class="sheet-text-input" id="liveStreamVisSelect">
                        <option value="Public">Public (Everyone can watch)</option>
                        <option value="Unlisted">Unlisted (Anyone with link)</option>
                        <option value="Private">Private (Only you)</option>
                    </select>
                </div>

                <!-- Thumbnail Upload -->
                <div class="sheet-field-group">
                    <label class="sheet-field-label">Live Thumbnail / Cover</label>
                    <div class="thumb-upload-row">
                        <div class="live-thumb-preview" id="liveThumbPreviewBox">
                            <span style="font-size:11px; color:var(--yt-muted);">Cover</span>
                            <img id="liveThumbImg" alt="Live Cover">
                        </div>
                        <button type="button" class="big-pill-btn" style="width:auto; padding:8px 16px; font-size:12px;" onclick="document.getElementById('liveThumbPicker').click()">Upload Thumbnail</button>
                    </div>
                </div>

                <button class="sheet-done-btn" onclick="saveLiveDetails()">Save Details</button>
            </div>
        </div>

        <!-- TURBO UPLOAD MODAL -->
        <div class="upload-hud-modal" id="uploadHudModal">
            <div class="upload-hud-card">
                <div class="turbo-badge">⚡ BHARAT-TURBO STREAM</div>
                <h3 style="font-size: 17px; margin-bottom: 4px;" id="hudFileName">video.mp4</h3>
                <div style="font-size: 12px; color: var(--yt-muted);" id="hudStatus">Processing chunks...</div>

                <div class="hud-progress-track">
                    <div class="hud-progress-fill" id="hudFill"></div>
                </div>

                <div style="display:flex; justify-content:space-between; font-size:12px; color:var(--yt-muted); margin-top:6px;">
                    <span id="hudSpeed">Speed: 48 MB/s</span>
                    <span id="hudPercent">0%</span>
                </div>
            </div>
        </div>

        <!-- POST SCREEN -->
        <div class="post-fullscreen-modal" id="postModal">
            <div>
                <header class="top-action-bar" style="position:relative; background:#000; border-bottom:1px solid var(--yt-border);">
                    <div style="display:flex; align-items:center; gap:16px;">
                        <button class="circle-icon-btn" onclick="closePostModal()">✕</button>
                        <span style="font-size:17px; font-weight:700;">Create post</span>
                    </div>
                    <button class="big-pill-btn" style="width:auto; padding:6px 20px; font-size:13px;" onclick="publishPostNow()">Post</button>
                </header>

                <div class="post-inner-content">
                    <div class="post-author-row">
                        <div class="post-author-avatar">CB</div>
                        <div>
                            <div style="font-size:14px; font-weight:600;">Charandas Bhaskar</div>
                            <div style="font-size:11px; color:var(--yt-muted);">Public post • All Subscribers</div>
                        </div>
                    </div>

                    <textarea class="post-textarea-main" id="postText" placeholder="Share an image or thoughts..."></textarea>

                    <div class="attached-post-img-box" id="attachedImgBox">
                        <img id="attachedPostImg" alt="Attached">
                        <button class="remove-attach-cross" onclick="removePostAttachment()">✕</button>
                    </div>
                </div>
            </div>

            <div class="post-bottom-suite">
                <div class="post-gallery-strip">
                    <div class="strip-card" onclick="document.getElementById('postImagePicker').click()">
                        <span>📷</span>
                    </div>
                    <div class="strip-card" onclick="attachPresetImg('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=600')">
                        <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=200" alt="Nature">
                    </div>
                </div>

                <div class="post-tools-tray">
                    <button class="tray-icon-btn" onclick="showToast('Poll tool active')" title="Poll">
                        <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/></svg>
                    </button>
                    <button class="tray-icon-btn" onclick="document.getElementById('postImagePicker').click()" title="Image">
                        <svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
                    </button>
                </div>

                <nav class="mode-scroll-deck" style="margin-top: 14px; margin-left: auto; margin-right: auto;">
                    <span class="mode-chip" onclick="switchMode('short'); closePostModal();">Short</span>
                    <span class="mode-chip" onclick="switchMode('live'); closePostModal();">Live</span>
                    <span class="mode-chip active">Post</span>
                </nav>
            </div>
        </div>

    </div>

    <div id="toast" class="toast"></div>

    <script>
        let currentMode = 'short';
        let isRecording = false;
        let isScreenSharing = false;
        let activeStream = null;

        const toast = document.getElementById('toast');
        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 1800);
        }

        window.addEventListener('load', () => {
            initCamera();
            renderToolsForMode('short');
        });

        function initCamera() {
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } }, 
                    audio: true 
                })
                .then(stream => {
                    activeStream = stream;
                    document.getElementById('liveCameraFeed').srcObject = stream;
                })
                .catch(() => {});
            }
        }

        function switchMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-chip').forEach(c => c.classList.remove('active'));
            const activeChip = document.getElementById('mode' + mode.charAt(0).toUpperCase() + mode.slice(1));
            if (activeChip) activeChip.classList.add('active');

            const soundPill = document.getElementById('topSoundPill');
            const captureRow = document.getElementById('captureRow');
            const liveInfo = document.getElementById('livePreviewInfo');
            const liveStack = document.getElementById('liveBtnStack');

            if (mode === 'short') {
                soundPill.style.display = 'flex';
                captureRow.style.display = 'flex';
                liveInfo.style.display = 'none';
                liveStack.style.display = 'none';
                renderToolsForMode('short');
                showToast('Shorts Camera Mode ⚡');
            } else if (mode === 'video') {
                soundPill.style.display = 'none';
                captureRow.style.display = 'flex';
                liveInfo.style.display = 'none';
                liveStack.style.display = 'none';
                renderToolsForMode('video');
                showToast('Video Mode Active 📹');
            } else if (mode === 'live') {
                soundPill.style.display = 'none';
                captureRow.style.display = 'none';
                liveInfo.style.display = 'flex';
                liveStack.style.display = 'flex';
                renderToolsForMode('live');
                showToast('Live Mode: ✏️ Edit or 📲 Screencast available');
            } else if (mode === 'post') {
                openPostModal();
            }
        }

        function renderToolsForMode(mode) {
            const col = document.getElementById('sideToolColumn');
            col.innerHTML = '';

            if (mode === 'short') {
                col.innerHTML = `
                    <div class="tool-action-item" onclick="showToast('Camera flipped')">
                        <div class="tool-round-btn"><svg viewBox="0 0 24 24"><path d="M9 12c0 1.66 1.34 3 3 3s3-1.34 3-3-1.34-3-3-3-3 1.34-3 3zm11-4h-3.17L15 6H9L7.17 8H4c-1.1 0-2 .9-2 2v9c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2z"/></svg></div>
                    </div>
                    <div class="tool-action-item" onclick="showToast('Timer: 3s')">
                        <div class="tool-round-btn"><svg viewBox="0 0 24 24"><path d="M15 1H9v2h6V1zm-4 13h2V8h-2v6zm8.03-6.61l1.42-1.42c-.43-.51-.9-.99-1.41-1.41l-1.42 1.42C16.07 4.74 14.12 4 12 4c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-2.12-.74-4.07-1.97-5.61zM12 20c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/></svg></div>
                    </div>
                    <div class="tool-action-item" onclick="showToast('60s set')">
                        <div class="tool-round-btn">15 s</div>
                    </div>
                    <div class="tool-action-item" onclick="showToast('Effects: Normal')">
                        <div class="tool-round-btn">✨</div>
                    </div>
                    <div class="tool-action-item" onclick="showToast('Speed: 1x')">
                        <div class="tool-round-btn">1x</div>
                    </div>
                `;
            } else if (mode === 'live') {
                // Live mode with Edit (✏️) and Screencast (📲)
                col.innerHTML = `
                    <div class="tool-action-item" onclick="openLiveEditSheet()">
                        <span class="tool-title">Edit details</span>
                        <div class="tool-round-btn">✏️</div>
                    </div>
                    <div class="tool-action-item" onclick="toggleScreenCast()">
                        <span class="tool-title">Screencast</span>
                        <div class="tool-round-btn">📲</div>
                    </div>
                    <div class="tool-action-item" onclick="showToast('Camera flipped')">
                        <span class="tool-title">Flip</span>
                        <div class="tool-round-btn">🔄</div>
                    </div>
                    <div class="tool-action-item" onclick="showToast('Mic Muted')">
                        <span class="tool-title">Mute</span>
                        <div class="tool-round-btn">🎙️</div>
                    </div>
                    <div class="tool-action-item" onclick="showToast('Video Hidden')">
                        <span class="tool-title">Hide video</span>
                        <div class="tool-round-btn">📹</div>
                    </div>
                `;
            } else {
                col.innerHTML = `
                    <div class="tool-action-item" onclick="showToast('Camera flipped')">
                        <div class="tool-round-btn">🔄</div>
                    </div>
                `;
            }
        }

        /* SCREENCAST / SCREEN SHARE TOGGLE */
        function toggleScreenCast() {
            if (!isScreenSharing) {
                if (navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia) {
                    navigator.mediaDevices.getDisplayMedia({ video: true })
                        .then(screenStream => {
                            isScreenSharing = true;
                            document.getElementById('liveCameraFeed').srcObject = screenStream;
                            showToast('📲 Screencast Mode Active (Screen Sharing)');

                            screenStream.getVideoTracks()[0].onended = () => {
                                isScreenSharing = false;
                                initCamera();
                                showToast('Switched back to camera');
                            };
                        })
                        .catch(() => {
                            showToast('📲 Screencast ready (Simulated)');
                        });
                } else {
                    showToast('📲 Mobile Screencast enabled');
                }
            } else {
                isScreenSharing = false;
                initCamera();
                showToast('Switched back to camera');
            }
        }

        /* LIVE DETAILS EDIT MODAL (PENCIL) */
        function openLiveEditSheet() {
            document.getElementById('liveEditModal').style.display = 'flex';
        }

        function closeLiveEditSheet() {
            document.getElementById('liveEditModal').style.display = 'none';
        }

        function saveLiveDetails() {
            const title = document.getElementById('liveStreamTitleInput').value.trim() || 'Charandas Bhaskar Live';
            const vis = document.getElementById('liveStreamVisSelect').value;
            document.getElementById('liveBadgeTitle').textContent = `${title} • ${vis}`;
            closeLiveEditSheet();
            showToast('Live stream settings updated! ✏️');
        }

        function loadLiveThumbnail(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = ev => {
                const img = document.getElementById('liveThumbImg');
                img.src = ev.target.result;
                img.style.display = 'block';
                showToast('Live Thumbnail set! 📷');
            };
            reader.readAsDataURL(file);
        }

        function handleLiveNext() {
            const title = document.getElementById('liveStreamTitleInput').value.trim() || 'Charandas Bhaskar Live';
            showToast('🔴 Entering Live Stream Room...');
            setTimeout(() => {
                window.location.href = `watch.html?title=${encodeURIComponent(title)}&channel=Charandas+Bhaskar&views=🔴+Live`;
            }, 500);
        }

        // Turbo upload
        function startTurboChunkUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            const modal = document.getElementById('uploadHudModal');
            const fill = document.getElementById('hudFill');
            const percentText = document.getElementById('hudPercent');
            const nameText = document.getElementById('hudFileName');
            const speedText = document.getElementById('hudSpeed');
            const statusText = document.getElementById('hudStatus');

            nameText.textContent = file.name;
            modal.style.display = 'flex';

            let progress = 0;
            const timer = setInterval(() => {
                progress += 10;
                fill.style.width = progress + '%';
                percentText.textContent = progress + '%';
                speedText.textContent = `Speed: ${(Math.random() * 20 + 35).toFixed(1)} MB/s`;

                if (progress >= 100) {
                    clearInterval(timer);
                    showToast('🎉 Super-Fast Upload Complete!');
                    setTimeout(() => {
                        modal.style.display = 'none';
                        const target = currentMode === 'short' ? 'shorts.html' : 'watch.html';
                        window.location.href = `${target}?title=${encodeURIComponent(file.name)}&channel=Charandas+Bhaskar&views=1+view`;
                    }, 500);
                }
            }, 60);
        }

        function toggleRecording() {
            isRecording = !isRecording;
            const ring = document.getElementById('shutterBtn');
            if (isRecording) {
                ring.classList.add('recording');
                showToast('Recording... 🔴');
            } else {
                ring.classList.remove('recording');
                showToast('Recording processed!');
                setTimeout(() => {
                    window.location.href = currentMode === 'short' ? 'shorts.html' : 'watch.html';
                }, 500);
            }
        }

        function selectMusicTrack() {
            const track = prompt('Select Track:\n1. Chhattisgarhi Folk\n2. Vande Mataram\n3. Lofi Beat', '1');
            if (track) {
                document.getElementById('soundLabel').textContent = 'Audio Set 🎵';
                showToast('Sound Attached 🎵');
            }
        }

        function openPostModal() {
            document.getElementById('postModal').style.display = 'flex';
        }

        function closePostModal() {
            document.getElementById('postModal').style.display = 'none';
            switchMode('short');
        }

        function attachPresetImg(url) {
            document.getElementById('attachedPostImg').src = url;
            document.getElementById('attachedImgBox').style.display = 'block';
            showToast('Photo Attached');
        }

        function removePostAttachment() {
            document.getElementById('attachedImgBox').style.display = 'none';
            document.getElementById('attachedPostImg').src = '';
        }

        function loadPostImage(e) {
            const file = e.target.files[0];
            if (!file) return;
            const r = new FileReader();
            r.onload = ev => attachPresetImg(ev.target.result);
            r.readAsDataURL(file);
        }

        function publishPostNow() {
            showToast('🎉 Post Published!');
            setTimeout(() => {
                window.location.href = 'profile.html';
            }, 600);
        }
    </script>
</body>
</html>
