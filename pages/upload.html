<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>BharatTube Camera & Create</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --yt-black: #000000;
            --yt-panel: #121212;
            --yt-panel2: #212121;
            --yt-border: rgba(255, 255, 255, 0.12);
            --yt-text: #ffffff;
            --yt-muted: #aaaaaa;
            --yt-blue: #3ea6ff;
            --yt-red: #ff0000;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
        }

        /* Full Viewport Container */
        .app-viewport {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: #000000;
            overflow: hidden;
        }

        /* Camera / Media Layer */
        .camera-background {
            position: absolute;
            inset: 0;
            z-index: 1;
            background: #0a0a0a;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .camera-background video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Top Action Overlay */
        .top-action-bar {
            position: relative;
            z-index: 20;
            height: 54px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 16px;
            margin-top: env(safe-area-inset-top, 0px);
        }

        .circle-icon-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            text-decoration: none;
            font-size: 18px;
        }

        .circle-icon-btn svg {
            width: 20px;
            height: 20px;
            fill: #ffffff;
        }

        .add-sound-pill {
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            padding: 7px 18px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .add-sound-pill svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        /* Right Side Toolbars */
        .side-tool-column {
            position: absolute;
            right: 14px;
            top: 70px;
            z-index: 20;
            display: flex;
            flex-direction: column;
            gap: 14px;
            align-items: center;
            max-height: calc(100vh - 240px);
            overflow-y: auto;
            scrollbar-width: none;
        }

        .side-tool-column::-webkit-scrollbar {
            display: none;
        }

        .tool-action-item {
            display: flex;
            align-items: center;
            gap: 8px;
            background: transparent;
            border: none;
            color: #ffffff;
            cursor: pointer;
            justify-content: flex-end;
            width: 100%;
        }

        .tool-title {
            font-size: 13px;
            font-weight: 500;
            text-shadow: 0 1px 4px rgba(0,0,0,0.8);
            white-space: nowrap;
        }

        .tool-round-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 14px;
            font-weight: 700;
            color: #ffffff;
        }

        .tool-round-btn svg {
            width: 20px;
            height: 20px;
            fill: #ffffff;
        }

        /* Fixed Bottom Control Deck */
        .bottom-control-deck {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 30;
            padding-bottom: max(14px, env(safe-area-inset-bottom, 14px));
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, transparent 100%);
        }

        .capture-row {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 0 24px;
        }

        .gallery-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        .gallery-preview-mini {
            width: 44px;
            height: 44px;
            border-radius: 8px;
            border: 2px solid #ffffff;
            background: #222;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gallery-preview-mini img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .gallery-box span {
            font-size: 11px;
            font-weight: 600;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }

        .shutter-outer-ring {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            border: 4px solid #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.15s;
        }

        .shutter-inner-red {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: #ff0000;
            transition: 0.2s;
        }

        .shutter-outer-ring.recording .shutter-inner-red {
            border-radius: 8px;
            width: 30px;
            height: 30px;
        }

        .big-pill-btn {
            background: #ffffff;
            color: #000000;
            border: none;
            border-radius: 24px;
            padding: 12px 34px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(0,0,0,0.5);
        }

        /* 4-Mode Selector Bar */
        .mode-scroll-deck {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            overflow-x: auto;
            scrollbar-width: none;
            padding: 4px 16px;
            width: 100%;
        }

        .mode-scroll-deck::-webkit-scrollbar {
            display: none;
        }

        .mode-chip {
            font-size: 14px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.6);
            cursor: pointer;
            padding: 6px 16px;
            border-radius: 20px;
            transition: 0.2s;
            white-space: nowrap;
        }

        .mode-chip.active {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.22);
            backdrop-filter: blur(10px);
        }

        /* Community Post Modal */
        .post-fullscreen-modal {
            display: none;
            position: absolute;
            inset: 0;
            background: #000000;
            z-index: 50;
            flex-direction: column;
            justify-content: space-between;
        }

        .post-inner-content {
            padding: 14px 16px;
        }

        .post-author-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .post-author-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #11998e, #38ef7d);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 17px;
            color: #ffffff;
            border: 1.5px solid rgba(255,255,255,0.2);
            flex-shrink: 0;
        }

        .post-author-name {
            font-size: 14px;
            font-weight: 600;
        }

        .post-visibility-pill {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--yt-border);
            color: #ffffff;
            padding: 4px 10px;
            border-radius: 14px;
            font-size: 12px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            margin-top: 3px;
        }

        .post-visibility-pill svg {
            width: 14px;
            height: 14px;
            fill: #ffffff;
        }

        .post-textarea-main {
            width: 100%;
            min-height: 150px;
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 16px;
            font-family: inherit;
            outline: none;
            resize: none;
            line-height: 1.45;
        }

        .post-textarea-main::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .attached-post-img-box {
            position: relative;
            margin: 10px 0;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--yt-border);
            display: none;
            max-height: 220px;
        }

        .attached-post-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .remove-attach-cross {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0,0,0,0.7);
            border: none;
            color: white;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .post-bottom-suite {
            padding-bottom: max(16px, env(safe-area-inset-bottom, 16px));
        }

        .post-gallery-strip {
            display: flex;
            gap: 8px;
            padding: 0 16px 12px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .post-gallery-strip::-webkit-scrollbar {
            display: none;
        }

        .strip-card {
            width: 66px;
            height: 66px;
            border-radius: 8px;
            background: #1a1a1a;
            border: 1px solid var(--yt-border);
            flex-shrink: 0;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .strip-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .post-tools-tray {
            display: flex;
            align-items: center;
            gap: 24px;
            padding: 10px 18px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .tray-icon-btn {
            background: none;
            border: none;
            color: #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
        }

        .tray-icon-btn svg {
            width: 24px;
            height: 24px;
            fill: #ffffff;
        }

        /* Add Details Sheet */
        .add-details-sheet {
            display: none;
            position: absolute;
            inset: 0;
            background: #000000;
            z-index: 100;
            flex-direction: column;
        }

        .details-header-row {
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            border-bottom: 1px solid var(--yt-border);
        }

        .details-body {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        .details-item-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
        }

        .item-left-block {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .item-left-block svg {
            width: 22px;
            height: 22px;
            fill: #ffffff;
        }

        .item-small-sub {
            font-size: 12px;
            color: var(--yt-muted);
        }

        .item-big-label {
            font-size: 15px;
            font-weight: 500;
            color: #ffffff;
            margin-top: 2px;
        }

        .yt-switch {
            position: relative;
            width: 44px;
            height: 24px;
            background: #333333;
            border-radius: 14px;
            transition: 0.2s;
            cursor: pointer;
        }

        .yt-switch::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 20px;
            height: 20px;
            background: #888888;
            border-radius: 50%;
            transition: 0.2s;
        }

        .yt-switch.checked {
            background: var(--yt-blue);
        }

        .yt-switch.checked::after {
            transform: translateX(20px);
            background: #ffffff;
        }

        /* Toast */
        .toast {
            position: fixed;
            left: 50%;
            bottom: 70px;
            transform: translate(-50%, 20px);
            background: #ffffff;
            color: #000000;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            opacity: 0;
            pointer-events: none;
            transition: 0.25s ease;
            z-index: 3000;
            white-space: nowrap;
        }

        .toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }
    </style>
</head>
<body>

    <input type="file" id="videoPicker" accept="video/*" style="display:none;" onchange="loadChosenVideo(event)">
    <input type="file" id="postImagePicker" accept="image/*" style="display:none;" onchange="loadPostImage(event)">

    <div class="app-viewport">

        <!-- CAMERA LAYER -->
        <div class="camera-background" id="cameraBackground">
            <video id="liveCameraFeed" autoplay playsinline muted></video>
        </div>

        <!-- TOP BAR -->
        <header class="top-action-bar">
            <a href="../frontend/index.html" class="circle-icon-btn">✕</a>

            <div class="add-sound-pill" id="topSoundPill" onclick="selectMusicTrack()">
                <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
                <span id="soundLabel">Add sound</span>
            </div>

            <div class="circle-icon-btn" onclick="showToast('Effects & Highlights ready ✨')">
                <svg viewBox="0 0 24 24"><path d="M19 9l1.25-2.75L23 5l-2.75-1.25L19 1l-1.25 2.75L15 5l2.75 1.25L19 9zm-7.5.5L9 4 6.5 9.5 1 12l5.5 2.5L9 20l2.5-5.5L17 12l-5.5-2.5zM19 15l-1.25 2.75L15 19l2.75 1.25L19 23l1.25-2.75L23 19l-2.75-1.25L19 15z"/></svg>
            </div>
        </header>

        <!-- RIGHT TOOLS -->
        <div class="side-tool-column" id="sideToolColumn"></div>

        <!-- BOTTOM DECK -->
        <div class="bottom-control-deck">
            <div class="capture-row" id="captureRow">
                <div class="gallery-box" onclick="document.getElementById('videoPicker').click()">
                    <div class="gallery-preview-mini">
                        <img src="https://images.unsplash.com/photo-1524492412937-b28074a5d7da?w=100" alt="Gallery">
                    </div>
                    <span>Add</span>
                </div>

                <div class="shutter-outer-ring" id="shutterBtn" onclick="toggleRecording()">
                    <div class="shutter-inner-red"></div>
                </div>

                <button class="big-pill-btn" id="nextActionBtn" style="display:none;" onclick="handleNextAction()">Next</button>

                <div style="width: 44px;"></div>
            </div>

            <nav class="mode-scroll-deck">
                <span class="mode-chip" id="modeVideo" onclick="switchMode('video')">Video</span>
                <span class="mode-chip active" id="modeShort" onclick="switchMode('short')">Short</span>
                <span class="mode-chip" id="modeLive" onclick="switchMode('live')">Live</span>
                <span class="mode-chip" id="modePost" onclick="switchMode('post')">Post</span>
            </nav>
        </div>

        <!-- POST SCREEN -->
        <div class="post-fullscreen-modal" id="postModal">
            <div>
                <header class="top-action-bar" style="border-bottom: 1px solid var(--yt-border); background:#000;">
                    <div style="display:flex; align-items:center; gap:16px;">
                        <button class="circle-icon-btn" onclick="closePostModal()">✕</button>
                        <span style="font-size:17px; font-weight:700;">Create post</span>
                    </div>
                    <button class="big-pill-btn" style="padding:6px 18px; font-size:13px;" onclick="publishPostNow()">Post</button>
                </header>

                <div class="post-inner-content">
                    <div class="post-author-row">
                        <div class="post-author-avatar">CB</div>
                        <div>
                            <div class="post-author-name">Charandas Bhaskar</div>
                            <div class="post-visibility-pill" onclick="openDetailsSheet()">
                                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
                                <span id="postChipVisLabel">Public</span>
                            </div>
                        </div>
                    </div>

                    <textarea class="post-textarea-main" id="postText" placeholder="Share an image to start a caption contest"></textarea>

                    <div class="attached-post-img-box" id="attachedImgBox">
                        <img id="attachedPostImg" alt="Attached">
                        <button class="remove-attach-cross" onclick="removePostAttachment()">✕</button>
                    </div>
                </div>
            </div>

            <div class="post-bottom-suite">
                <div class="post-gallery-strip">
                    <div class="strip-card" onclick="document.getElementById('postImagePicker').click()">
                        <span>📷</span>
                    </div>
                    <div class="strip-card" onclick="attachPresetImg('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=600')">
                        <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=200" alt="Nature">
                    </div>
                    <div class="strip-card" onclick="attachPresetImg('https://images.unsplash.com/photo-1518495973542-4542c06a5843?w=600')">
                        <img src="https://images.unsplash.com/photo-1518495973542-4542c06a5843?w=200" alt="Sunset">
                    </div>
                </div>

                <div class="post-tools-tray">
                    <button class="tray-icon-btn" onclick="promptPoll()" title="Poll">
                        <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/></svg>
                    </button>
                    <button class="tray-icon-btn" onclick="document.getElementById('postImagePicker').click()" title="Image">
                        <svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
                    </button>
                    <button class="tray-icon-btn" onclick="promptQuiz()" title="Quiz">
                        <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-9 14l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
                    </button>
                </div>

                <nav class="mode-scroll-deck" style="padding-top: 14px;">
                    <span class="mode-chip" onclick="switchMode('short'); closePostModal();">Short</span>
                    <span class="mode-chip" onclick="switchMode('live'); closePostModal();">Live</span>
                    <span class="mode-chip active">Post</span>
                </nav>
            </div>
        </div>

        <!-- DETAILS SHEET -->
        <div class="add-details-sheet" id="detailsSheet">
            <header class="details-header-row">
                <div style="display:flex; align-items:center; gap:16px;">
                    <button class="circle-icon-btn" onclick="closeDetailsSheet()">✕</button>
                    <span style="font-size:17px; font-weight:700;">Add details</span>
                </div>
                <button class="big-pill-btn" style="padding:6px 18px; font-size:13px;" onclick="closeDetailsSheet()">Done</button>
            </header>

            <div class="details-body">
                <div class="details-item-row" onclick="cyclePostVis()">
                    <div class="item-left-block">
                        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
                        <div>
                            <div class="item-small-sub">Visibility</div>
                            <div class="item-big-label" id="sheetVisVal">Public</div>
                        </div>
                    </div>
                </div>

                <div class="details-item-row" onclick="toggleSwitch('schedSwitch')">
                    <div class="item-left-block">
                        <svg viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7z"/></svg>
                        <div>
                            <div class="item-big-label">Schedule</div>
                        </div>
                    </div>
                    <div class="yt-switch" id="schedSwitch"></div>
                </div>

                <div class="details-item-row" onclick="toggleExpirySwitch()">
                    <div class="item-left-block">
                        <svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
                        <div>
                            <div class="item-small-sub">Expiry</div>
                            <div class="item-big-label" id="sheetExpiryVal">None</div>
                        </div>
                    </div>
                    <div class="yt-switch" id="expirySwitch"></div>
                </div>
            </div>
        </div>

    </div>

    <div id="toast" class="toast"></div>

    <script>
        let currentMode = 'short';
        let isRecording = false;

        const toast = document.getElementById('toast');
        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        window.addEventListener('load', () => {
            initCamera();
            renderToolsForMode('short');
        });

        function initCamera() {
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: true })
                    .then(stream => {
                        document.getElementById('liveCameraFeed').srcObject = stream;
                    })
                    .catch(() => {});
            }
        }

        function switchMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-chip').forEach(c => c.classList.remove('active'));
            const activeChip = document.getElementById('mode' + mode.charAt(0).toUpperCase() + mode.slice(1));
            if (activeChip) activeChip.classList.add('active');

            const soundPill = document.getElementById('topSoundPill');
            const shutter = document.getElementById('shutterBtn');
            const nextBtn = document.getElementById('nextActionBtn');

            if (mode === 'short') {
                soundPill.style.display = 'flex';
                shutter.style.display = 'flex';
                nextBtn.style.display = 'none';
                renderToolsForMode('short');
                showToast('Shorts Camera Mode ⚡');
            } else if (mode === 'video') {
                soundPill.style.display = 'none';
                shutter.style.display = 'flex';
                nextBtn.style.display = 'none';
                renderToolsForMode('video');
                showToast('Video Recording Mode 📹');
            } else if (mode === 'live') {
                soundPill.style.display = 'none';
                shutter.style.display = 'none';
                nextBtn.style.display = 'block';
                nextBtn.textContent = 'Next';
                renderToolsForMode('live');
                showToast('Live Stream Setup 🔴');
            } else if (mode === 'post') {
                openPostModal();
            }
        }

        function renderToolsForMode(mode) {
            const col = document.getElementById('sideToolColumn');
            col.innerHTML = '';

            if (mode === 'short') {
                col.innerHTML = `
                    <div class="tool-action-item" onclick="showToast('Camera flipped')">
                        <div class="tool-round-btn"><svg viewBox="0 0 24 24"><path d="M9 12c0 1.66 1.34 3 3 3s3-1.34 3-3-1.34-3-3-3-3 1.34-3 3zm11-4h-3.17L15 6H9L7.17 8H4c-1.1 0-2 .9-2 2v9c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2z"/></svg></div>
                    </div>
                    <div class="tool-action-item" onclick="showToast('Timer: 3s')">
                        <div class="tool-round-btn"><svg viewBox="0 0 24 24"><path d="M15 1H9v2h6V1zm-4 13h2V8h-2v6zm8.03-6.61l1.42-1.42c-.43-.51-.9-.99-1.41-1.41l-1.42 1.42C16.07 4.74 14.12 4 12 4c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-2.12-.74-4.07-1.97-5.61zM12 20c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/></svg></div>
                    </div>
                    <div class="tool-action-item" onclick="showToast('Switched to 60s')">
                        <div class="tool-round-btn" style="font-size:12px;">15 s</div>
                    </div>
                    <div class="tool-action-item" onclick="showToast('Effects active ✨')">
                        <div class="tool-round-btn">✨</div>
                    </div>
                    <div class="tool-action-item" onclick="showToast('Speed: 1x')">
                        <div class="tool-round-btn" style="font-size:12px;">1x</div>
                    </div>
                `;
            } else if (mode === 'live') {
                col.innerHTML = `
                    <div class="tool-action-item" onclick="showToast('Flip camera')">
                        <span class="tool-title">Flip</span>
                        <div class="tool-round-btn">🔄</div>
                    </div>
                    <div class="tool-action-item" onclick="showToast('Mic Muted 🔇')">
                        <span class="tool-title">Mute</span>
                        <div class="tool-round-btn">🎙️</div>
                    </div>
                    <div class="tool-action-item" onclick="showToast('Video hidden')">
                        <span class="tool-title">Hide video</span>
                        <div class="tool-round-btn">📹</div>
                    </div>
                    <div class="tool-action-item" onclick="showToast('Orientation locked')">
                        <span class="tool-title">Orientation</span>
                        <div class="tool-round-btn">📱</div>
                    </div>
                    <div class="tool-action-item" onclick="showToast('Green screen on')">
                        <span class="tool-title">Green screen</span>
                        <div class="tool-round-btn">👤</div>
                    </div>
                `;
            } else {
                col.innerHTML = `
                    <div class="tool-action-item" onclick="showToast('Flip')">
                        <div class="tool-round-btn">🔄</div>
                    </div>
                    <div class="tool-action-item" onclick="showToast('Flash on ⚡')">
                        <div class="tool-round-btn">⚡</div>
                    </div>
                `;
            }
        }

        function toggleRecording() {
            isRecording = !isRecording;
            const ring = document.getElementById('shutterBtn');
            const nextBtn = document.getElementById('nextActionBtn');

            if (isRecording) {
                ring.classList.add('recording');
                showToast('Recording started... 🔴');
            } else {
                ring.classList.remove('recording');
                showToast('Recording saved!');
                ring.style.display = 'none';
                nextBtn.style.display = 'block';
            }
        }

        function handleNextAction() {
            if (currentMode === 'live') {
                showToast('🔴 Entering Live Room...');
                setTimeout(() => {
                    window.location.href = `watch.html?title=Charandas+Bhaskar+Live&channel=Charandas+Bhaskar&views=🔴+Live+Now`;
                }, 800);
            } else {
                window.location.href = currentMode === 'short' ? 'shorts.html' : 'watch.html';
            }
        }

        function selectMusicTrack() {
            const track = prompt('Choose Audio Track:\n1. Chhattisgarhi Folk Beats\n2. Vande Mataram\n3. Trending Lofi', '1');
            if (track) {
                document.getElementById('soundLabel').textContent = 'Folk Beats 🎵';
                showToast('Sound applied! 🎵');
            }
        }

        function openPostModal() {
            document.getElementById('postModal').style.display = 'flex';
        }

        function closePostModal() {
            document.getElementById('postModal').style.display = 'none';
            switchMode('short');
        }

        function openDetailsSheet() {
            document.getElementById('detailsSheet').style.display = 'flex';
        }

        function closeDetailsSheet() {
            document.getElementById('detailsSheet').style.display = 'none';
        }

        function toggleSwitch(id) {
            const el = document.getElementById(id);
            el.classList.toggle('checked');
            showToast(el.classList.contains('checked') ? 'Schedule Active 📅' : 'Schedule Off');
        }

        function toggleExpirySwitch() {
            const el = document.getElementById('expirySwitch');
            el.classList.toggle('checked');
            const val = document.getElementById('sheetExpiryVal');
            val.textContent = el.classList.contains('checked') ? '24 hours' : 'None';
            showToast('Expiry: ' + val.textContent);
        }

        function cyclePostVis() {
            const val = document.getElementById('sheetVisVal');
            val.textContent = val.textContent === 'Public' ? 'Members Only' : 'Public';
            document.getElementById('postChipVisLabel').textContent = val.textContent;
            showToast('Visibility: ' + val.textContent);
        }

        function attachPresetImg(url) {
            document.getElementById('attachedPostImg').src = url;
            document.getElementById('attachedImgBox').style.display = 'block';
            showToast('Photo selected! 📷');
        }

        function removePostAttachment() {
            document.getElementById('attachedImgBox').style.display = 'none';
            document.getElementById('attachedPostImg').src = '';
            showToast('Photo removed');
        }

        function loadPostImage(e) {
            const file = e.target.files[0];
            if (!file) return;
            const r = new FileReader();
            r.onload = ev => {
                attachPresetImg(ev.target.result);
            };
            r.readAsDataURL(file);
        }

        function promptPoll() {
            const q = prompt('Poll Question:', 'Next video topic?');
            if (q) {
                const area = document.getElementById('postText');
                area.value = (area.value + `\n\n📊 POLL: ${q}\n1. Option A\n2. Option B`).trim();
                showToast('Poll added!');
            }
        }

        function promptQuiz() {
            const q = prompt('Quiz Question:', 'India Capital?');
            if (q) {
                const area = document.getElementById('postText');
                area.value = (area.value + `\n\n✅ QUIZ: ${q}\n[A] New Delhi (Correct)`).trim();
                showToast('Quiz added!');
            }
        }

        function publishPostNow() {
            showToast('🎉 Community Post Published!');
            setTimeout(() => {
                window.location.href = 'profile.html';
            }, 900);
        }

        function loadChosenVideo(e) {
            const file = e.target.files[0];
            if (!file) return;
            showToast('Video chosen: ' + file.name);
            document.getElementById('shutterBtn').style.display = 'none';
            const nextBtn = document.getElementById('nextActionBtn');
            nextBtn.style.display = 'block';
        }
    </script>
</body>
</html>
