        .input-item {
            display: flex;
            flex-direction: column;

        .input-item label {
            font-size: 12px;
            color: var(--yt-muted);
            font-weight: 500;
        }

        .input-item input, .input-item textarea, .input-item select {
            width: 100%;
            background: #101010;

        /* Monetization Toggle Switch */

        .switch-slider`pages/upload.html` ke liye YouTube Studio jaisa clean aur professional upload interface taiyar karte hain. 

Is page mein yeh saari suvidhayein shamil hongi:
1. **Video Picker & Preview Box**: File select karte hi instant preview.
2. **Metadata Inputs**: Video Title, Description, aur Category selection.
3. **Thumbnail Selector**: Custom thumbnail choose karne ka option.
4. **Visibility Controls**: Public, Unlisted, ya Private options.
5. **Monetization Switch**: Agar channel eligible/approved ho, toh video par ads on/off karne ka toggle.
6. **Publish Flow**: Video publish hote hi data `localStorage` mein store hokar direct Home ya Channel feed par dikhega.

---

### Step-by-Step GitHub Guide:

1. GitHub par `BharatTube` repo kholein.
2. `pages` folder mein jayein.
3. **Add file** -> **Create new file** par tap karein.
4. File ka naam likhein: `pages/upload.html`
5. Neeche diya gaya code paste karein aur **Commit changes...** dabakar save kar lein.

---

### `pages/upload.html` Code:

```html
<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0f0f0f">
    <title>Upload Video - BharatTube Studio</title>
    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="stylesheet" href="../assets/css/components.css">
    <style>
        body {
            padding-bottom: calc(var(--bottom-bar-height) + 30px);
        }

        .upload-header {
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            position: sticky;
            top: 0;
            background: var(--yt-black);
            z-index: 100;
            border-bottom: 1px solid var(--yt-border);
        }

        .header-title-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-icon-back {
            background: none;
            border: none;
            color: #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
        }

        .btn-icon-back svg {
            width: 22px;
            height: 22px;
            fill: #ffffff;
        }

        .btn-publish {
            background: var(--yt-blue);
            color: #0f0f0f;
            border: none;
            border-radius: 18px;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-publish:disabled {
            background: #2a2a2a;
            color: #666666;
            cursor: not-allowed;
        }

        .upload-container {
            padding: 16px;
            max-width: 680px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* File Dropzone */
        .dropzone-box {
            border: 2px dashed rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            padding: 30px 16px;
            text-align: center;
            background: var(--yt-surface);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .dropzone-box:hover {
            border-color: var(--yt-blue);
        }

        .dropzone-icon-circle {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .dropzone-icon-circle svg {
            width: 28px;
            height: 28px;
            fill: var(--yt-blue);
        }

        .file-hidden-input {
            display: none;
        }

        /* Preview Stage */
        .preview-box {
            display: none;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
            border: 1px solid var(--yt-border);
            aspect-ratio: 16 / 9;
            width: 100%;
        }

        .preview-box video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Form Fields */
        .form-card {
            background: var(--yt-surface);
            border: 1px solid var(--yt-border);
            border-radius: 14px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-size: 12px;
            color: var(--yt-muted);
            font-weight: 600;
        }

        .input-control {
            background: #101010;
            border: 1px solid var(--yt-border);
            border-radius: 8px;
            padding: 10px 12px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            font-family: inherit;
        }

        .input-control:focus {
            border-color: var(--yt-blue);
        }

        /* Monetization Toggle Switch */
        .toggle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0;
        }

        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #333333;
            transition: .3s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;

        input:checked + .slider {
            background-color: var(--yt-green);
        }

        input:checked + .slider:before {
            transform: translateX(20px);
        }
    </style>
</head>
<body>

    <!-- Studio Header -->
    <header class="upload-header">
        <div class="header-title-wrap">
            <button class="btn-icon-back" onclick="window.history.back()">
                <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            </button>
            <span style="font-weight: 700; font-size: 16px;">Create & Upload</span>
        </div>
        <button class="btn-publish" id="publishBtn" onclick="handlePublish()" disabled>Publish</button>
    </header>

    <div class="upload-container">
        <!-- Video Upload Trigger -->
        <div class="dropzone-box" id="dropzoneBox" onclick="document.getElementById('videoFileInput').click()">
            <div class="dropzone-icon-circle">
                <svg viewBox="0 0 24 24"><path d="M9 16h6v-6h4l-7-7-7 7h4v6zm-4 2h14v2H5v-2z"/></svg>
            </div>
            <div>
                <b style="font-size: 14px;">Select Video File</b>
                <p style="font-size: 12px; color: var(--yt-muted); margin-top: 3px;">Tap here to pick MP4, WebM or MOV</p>
            </div>
        </div>
        <input type="file" id="videoFileInput" class="file-hidden-input" accept="video/*" onchange="handleVideoSelection(event)">

        <!-- Video Preview Container -->
        <div class="preview-box" id="videoPreviewWrap">
            <video id="previewPlayer" controls playsinline></video>
        </div>

        <!-- Video Metadata Form -->
        <div class="form-card">
            <div class="input-group">
                <label>Video Title (Required)</label>
                <input type="text" id="videoTitleInput" class="input-control" placeholder="Add a title that describes your video" oninput="validateForm()">
            </div>

            <div class="input-group">
                <label>Description</label>
                <textarea id="videoDescInput" class="input-control" rows="3" placeholder="Tell viewers about your video (#tags, credits)"></textarea>
            </div>

            <div class="input-group">
                <label>Category</label>
                <select id="videoCategorySelect" class="input-control">
                    <option value="Entertainment">Entertainment & Culture</option>
                    <option value="Music">Music & Folk</option>
                    <option value="Education">Education & Tech</option>
                    <option value="News">News & Updates</option>
                    <option value="Vlog">Daily Life & Vlog</option>
                </select>
            </div>

            <div class="input-group">
                <label>Visibility</label>
                <select id="videoVisibilitySelect" class="input-control">
                    <option value="Public">Public (Anyone can search and view)</option>
                    <option value="Unlisted">Unlisted (Anyone with link can view)</option>
                    <option value="Private">Private (Only you can view)</option>
                </select>
            </div>

            <!-- Monetization Toggle -->
            <div class="toggle-row">
                <div>
                    <div style="font-size: 14px; font-weight: 600;">Video Monetization</div>
                    <div style="font-size: 11px; color: var(--yt-muted);">Show ads on this video to earn revenue</div>
                </div>
                <label class="toggle-switch">
                    <input type="checkbox" id="monetizeToggle" checked>
                    <span class="slider"></span>
                </label>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../assets/js/app-state.js"></script>
    <script src="../assets/js/ui-kit.js"></script>

    <script>
        let selectedVideoFile = null;

        function handleVideoSelection(event) {
            const file = event.target.files[0];
            if (file) {
                selectedVideoFile = file;
                const fileUrl = URL.createObjectURL(file);
                
                const previewWrap = document.getElementById('videoPreviewWrap');
                const player = document.getElementById('previewPlayer');
                const dropzone = document.getElementById('dropzoneBox');

                player.src = fileUrl;
                previewWrap.style.display = 'block';
                dropzone.style.display = 'none';

                // Auto-fill title from filename
                const defaultTitle = file.name.replace(/\.[^/.]+$/, "");
                const titleField = document.getElementById('videoTitleInput');
                if (!titleField.value) {
                    titleField.value = defaultTitle;
                }
                validateForm();
            }
        }

        function validateForm() {
            const title = document.getElementById('videoTitleInput').value.trim();
            const publishBtn = document.getElementById('publishBtn');
            publishBtn.disabled = !(selectedVideoFile && title.length > 0);
        }

        function handlePublish() {
            const title = document.getElementById('videoTitleInput').value.trim();
            const desc = document.getElementById('videoDescInput').value.trim();
            const category = document.getElementById('videoCategorySelect').value;
            const visibility = document.getElementById('videoVisibilitySelect').value;
            const monetizationEnabled = document.getElementById('monetizeToggle').checked;

            const newVideo = {
                id: 'bt_' + Date.now(),
                title: title,
                description: desc,
                category: category,
                visibility: visibility,
                monetized: monetizationEnabled,
                uploadedAt: new Date().toLocaleDateString(),
                views: '1 view',
                channel: 'Charandas Bhaskar'
            };

            // Save to LocalStorage video queue
            let existingVideos = JSON.parse(localStorage.getItem('bt_creator_uploads') || '[]');
            existingVideos.unshift(newVideo);
            localStorage.setItem('bt_creator_uploads', JSON.stringify(existingVideos));

            alert('🎉 Video Successfully Uploaded & Published to BharatTube!');
            window.location.href = 'profile.html';
        }
    </script>
</body>
</html>
