<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0f0f0f">
    <title>Create & Upload - BharatTube</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0f0f0f;
            color: #ffffff;
            padding-bottom: 80px;
        }

        /* Top Header */
        .upload-header {
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            position: sticky;
            top: 0;
            background: #0f0f0f;
            z-index: 100;
            border-bottom: 1px solid #272727;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .btn-back {
            background: none;
            border: none;
            color: #ffffff;
            display: flex;
            align-items: center;
            cursor: pointer;
            text-decoration: none;
        }

        .btn-back svg {
            width: 22px;
            height: 22px;
            fill: #ffffff;
        }

        .upload-header-title {
            font-size: 17px;
            font-weight: 700;
        }

        .btn-publish {
            background: #272727;
            color: #717171;
            border: none;
            padding: 7px 16px;
            border-radius: 18px;
            font-size: 13px;
            font-weight: 700;
            cursor: not-allowed;
            transition: all 0.2s ease;
        }

        .btn-publish.active {
            background: #3ea6ff;
            color: #0f0f0f;
            cursor: pointer;
        }

        /* Form Wrapper */
        .upload-container {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        /* Video Picker Dropzone */
        .video-dropzone {
            width: 100%;
            height: 180px;
            background: #181818;
            border: 2px dashed #3a3a3a;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .video-dropzone:active {
            border-color: #3ea6ff;
        }

        .icon-circle-upload {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #272727;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-circle-upload svg {
            width: 24px;
            height: 24px;
            fill: #3ea6ff;
        }

        .dropzone-title {
            font-size: 15px;
            font-weight: 700;
        }

        .dropzone-sub {
            font-size: 12px;
            color: #888888;
        }

        .preview-video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        /* Input Fields Card */
        .upload-form-card {
            background: #181818;
            border: 1px solid #272727;
            border-radius: 14px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-label {
            font-size: 12px;
            color: #aaaaaa;
            font-weight: 600;
        }

        .form-input, .form-textarea, .form-select {
            width: 100%;
            background: #222222;
            border: 1px solid #333333;
            border-radius: 8px;
            padding: 10px 12px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
        }

        .form-input:focus, .form-textarea:focus, .form-select:focus {
            border-color: #3ea6ff;
        }

        .form-textarea {
            resize: none;
            height: 80px;
        }

        /* Toggle Option */
        .toggle-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 6px;
        }

        .toggle-text {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .toggle-title {
            font-size: 14px;
            font-weight: 600;
        }

        .toggle-sub {
            font-size: 11px;
            color: #888888;
        }

        /* Switch UI */
        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
            flex-shrink: 0;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background-color: #333333;
            transition: .3s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #2ba640;
        }

        input:checked + .slider:before {
            transform: translateX(20px);
        }

        /* Progress Bar Popup */
        .upload-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            z-index: 2000;
            gap: 16px;
        }

        .upload-overlay.active {
            display: flex;
        }

        .progress-box {
            width: 100%;
            max-width: 320px;
            background: #222222;
            border-radius: 10px;
            height: 8px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: #3ea6ff;
            transition: width 0.2s linear;
        }

        /* Bottom Nav */
        .bottom-nav-fixed {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 56px;
            background: #0f0f0f;
            display: flex;
            align-items: center;
            justify-content: space-around;
            border-top: 1px solid #272727;
            z-index: 1000;
        }

        .nav-link-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 10px;
            color: #aaaaaa;
            text-decoration: none;
            gap: 3px;
        }

        .nav-link-btn svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        .nav-btn-plus {
            background: #ffffff;
            border-radius: 50%;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #0f0f0f;
            text-decoration: none;
        }

        .nav-btn-plus svg {
            width: 22px;
            height: 22px;
            fill: #0f0f0f;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="upload-header">
        <div class="header-left">
            <a href="../index.html" class="btn-back">
                <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            </a>
            <span class="upload-header-title">Create & Upload</span>
        </div>
        <button class="btn-publish" id="publishBtn" onclick="handlePublish()">Publish</button>
    </header>

    <!-- Upload Form -->
    <main class="upload-container">

        <!-- Hidden Native File Input -->
        <input type="file" id="videoFileInput" accept="video/*" style="display:none;" onchange="onFileSelected(event)">

        <!-- Video Picker Container -->
        <div class="video-dropzone" onclick="document.getElementById('videoFileInput').click()">
            <div class="icon-circle-upload" id="uploadIconBox">
                <svg viewBox="0 0 24 24"><path d="M9 16h6v-6h4l-7-7-7 7h4v6zm-4 2h14v2H5v-2z"/></svg>
            </div>
            <div class="dropzone-title" id="dropzoneTitle">Select Video File</div>
            <div class="dropzone-sub" id="dropzoneSub">Tap here to pick MP4, WebM or MOV</div>
            <video class="preview-video" id="videoPreview" autoplay loop muted playsinline></video>
        </div>

        <!-- Meta Input Fields -->
        <section class="upload-form-card">
            <div class="form-group">
                <label class="form-label">Video Title (Required)</label>
                <input type="text" class="form-input" id="videoTitleInput" placeholder="Add a title that describes your video" oninput="validateForm()">
            </div>

            <div class="form-group">
                <label class="form-label">Description</label>
                <textarea class="form-textarea" id="videoDescInput" placeholder="Tell viewers about your video (#tags, credits)"></textarea>
            </div>

            <div class="form-group">
                <label class="form-label">Category</label>
                <select class="form-select" id="videoCategory">
                    <option value="Entertainment & Culture">Entertainment & Culture</option>
                    <option value="Music & Folk">Music & Folk</option>
                    <option value="Tech & Education">Tech & Education</option>
                    <option value="News & Facts">News & Facts</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">Visibility</label>
                <select class="form-select" id="videoVisibility">
                    <option value="Public">Public (Anyone can search and view)</option>
                    <option value="Unlisted">Unlisted (Anyone with link)</option>
                    <option value="Private">Private (Only you)</option>
                </select>
            </div>

            <div class="toggle-group">
                <div class="toggle-text">
                    <span class="toggle-title">Video Monetization</span>
                    <span class="toggle-sub">Show ads on this video to earn revenue</span>
                </div>
                <label class="switch">
                    <input type="checkbox" id="monetizeToggle" checked>
                    <span class="slider"></span>
                </label>
            </div>
        </section>

    </main>

    <!-- Upload Progress Modal -->
    <div class="upload-overlay" id="uploadModal">
        <h3 id="uploadStatusText">Uploading Video... 0%</h3>
        <div class="progress-box">
            <div class="progress-bar-fill" id="progressBar"></div>
        </div>
        <p style="font-size:12px; color:#aaa;">Please keep this page open while processing</p>
    </div>

    <!-- Bottom App Navigation Bar -->
    <nav class="bottom-nav-fixed">
        <a href="../index.html" class="nav-link-btn">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span>Home</span>
        </a>
        <a href="shorts.html" class="nav-link-btn">
            <svg viewBox="0 0 24 24"><path d="M17.77 10.32l-1.2-.5-1.1-.46 1.05-.53c1.78-.9 2.5-3.08 1.6-4.86-.9-1.78-3.08-2.5-4.86-1.6L6.5 5.67c-1.78.9-2.5 3.08-1.6 4.86.32.64.83 1.13 1.44 1.43l1.2.5 1.1.46-1.05.53c-1.78.9-2.5 3.08-1.6 4.86.63 1.25 1.88 1.99 3.23 1.99.55 0 1.11-.13 1.63-.39l6.76-3.3c1.78-.9 2.5-3.08 1.6-4.86-.32-.64-.83-1.13-1.44-1.43zM10 14.5v-5l4.5 2.5-4.5 2.5z"/></svg>
            <span>Shorts</span>
        </a>
        <a href="upload.html" class="nav-btn-plus">
            <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        </a>
        <a href="channel.html" class="nav-link-btn">
            <svg viewBox="0 0 24 24"><path d="M20 8H4V6h16v2zm-2-6H6v2h12V2zm4 10v8c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2v-8c0-1.1.9-2 2-2h16c1.1 0 2 .9 2 2zm-6 4l-6-3.27v6.53L16 16z"/></svg>
            <span>Subscriptions</span>
        </a>
        <a href="profile.html" class="nav-link-btn">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>
            <span>You</span>
        </a>
    </nav>

    <script>
        // Handle Video Selection
        function onFileSelected(event) {
            const file = event.target.files[0];
            if (!file) return;

            const preview = document.getElementById('videoPreview');
            const icon = document.getElementById('uploadIconBox');
            const title = document.getElementById('dropzoneTitle');
            const sub = document.getElementById('dropzoneSub');

            const videoUrl = URL.createObjectURL(file);
            preview.src = videoUrl;
            preview.style.display = 'block';
            icon.style.display = 'none';
            title.style.display = 'none';
            sub.style.display = 'none';

            // Auto-fill Title if empty
            const titleInput = document.getElementById('videoTitleInput');
            if (!titleInput.value) {
                titleInput.value = file.name.replace(/\.[^/.]+$/, "");
                validateForm();
            }
        }

        // Validate Title input to activate Publish button
        function validateForm() {
            const title = document.getElementById('videoTitleInput').value.trim();
            const btn = document.getElementById('publishBtn');
            if (title.length > 0) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        }

        // Upload Simulation
        function handlePublish() {
            const btn = document.getElementById('publishBtn');
            if (!btn.classList.contains('active')) return;

            const modal = document.getElementById('uploadModal');
            const bar = document.getElementById('progressBar');
            const status = document.getElementById('uploadStatusText');

            modal.classList.add('active');

            let progress = 0;
            const timer = setInterval(() => {
                progress += 10;
                bar.style.width = progress + '%';
                status.innerText = `Uploading Video... ${progress}%`;

                if (progress >= 100) {
                    clearInterval(timer);
                    status.innerText = 'Upload Complete! Video Published 🎉';
                    setTimeout(() => {
                        window.location.href = '../index.html';
                    }, 1200);
                }
            }, 180);
        }
    </script>
</body>
</html>
