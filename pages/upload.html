<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>BharatTube Studio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --yt-black: #000000;
            --yt-panel: #181818;
            --yt-panel2: #242424;
            --yt-border: rgba(255, 255, 255, 0.14);
            --yt-text: #ffffff;
            --yt-muted: #aaaaaa;
            --yt-blue: #3ea6ff;
            --yt-red: #ff0000;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
            position: fixed;
        }

        .app-viewport {
            width: 100%;
            height: 100%;
            position: relative;
            background: #000000;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* 1. Camera Viewport */
        .camera-background {
            position: absolute;
            inset: 0;
            z-index: 1;
            background: #0a0a0a;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .camera-background video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 2. Top Action Bar */
        .top-action-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 50;
            height: calc(56px + env(safe-area-inset-top, 0px));
            padding: env(safe-area-inset-top, 10px) 16px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(to bottom, rgba(0,0,0,0.65) 0%, transparent 100%);
        }

        .circle-icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            text-decoration: none;
            font-size: 19px;
        }

        .circle-icon-btn svg {
            width: 20px;
            height: 20px;
            fill: #ffffff;
        }

        .add-sound-pill {
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #ffffff;
            padding: 8px 18px;
            border-radius: 24px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .add-sound-pill svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        /* 3. Right Sidebar Tools */
        .side-tool-column {
            position: absolute;
            right: 14px;
            top: calc(70px + env(safe-area-inset-top, 0px));
            z-index: 50;
            display: flex;
            flex-direction: column;
            gap: 14px;
            align-items: flex-end;
            max-height: calc(100vh - 250px);
            overflow-y: auto;
            scrollbar-width: none;
        }

        .side-tool-column::-webkit-scrollbar {
            display: none;
        }

        .tool-action-item {
            display: flex;
            align-items: center;
            gap: 8px;
            background: transparent;
            border: none;
            color: #ffffff;
            cursor: pointer;
        }

        .tool-title {
            font-size: 13px;
            font-weight: 600;
            text-shadow: 0 1px 4px rgba(0,0,0,0.9);
            white-space: nowrap;
        }

        .tool-round-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.22);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 14px;
            font-weight: 700;
            color: #ffffff;
        }

        .tool-round-btn svg {
            width: 22px;
            height: 22px;
            fill: #ffffff;
        }

        /* 4. Bottom Capture & Controls Deck */
        .bottom-control-deck {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 60;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            padding-bottom: max(18px, env(safe-area-inset-bottom, 18px));
            background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.7) 60%, transparent 100%);
        }

        .live-preview-info {
            width: 100%;
            padding: 0 24px;
            display: none;
            flex-direction: column;
            gap: 8px;
            align-items: center;
        }

        .live-creator-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0,0,0,0.6);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid var(--yt-border);
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .live-creator-avatar {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #2ecc71;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: bold;
        }

        .capture-row {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 0 20px;
        }

        .gallery-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            width: 54px;
        }

        .gallery-preview-mini {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            border: 2px solid #ffffff;
            background: #222;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }

        .gallery-preview-mini img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .gallery-box span {
            font-size: 11px;
            font-weight: 700;
            text-shadow: 0 1px 3px rgba(0,0,0,0.9);
        }

        .shutter-outer-ring {
            width: 74px;
            height: 74px;
            border-radius: 50%;
            border: 4px solid #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            background: rgba(0,0,0,0.25);
            transition: transform 0.15s;
        }

        .shutter-inner-red {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: #ff0000;
            transition: 0.2s;
        }

        .shutter-outer-ring.recording .shutter-inner-red {
            border-radius: 8px;
            width: 30px;
            height: 30px;
        }

        .live-btn-stack {
            display: none;
            width: 100%;
            padding: 0 20px;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .big-pill-btn {
            width: 100%;
            max-width: 320px;
            background: #ffffff;
            color: #000000;
            border: none;
            border-radius: 28px;
            padding: 12px 0;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 4px 14px rgba(0,0,0,0.6);
        }

        .practice-mode-btn {
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-shadow: 0 1px 4px rgba(0,0,0,0.8);
        }

        /* 5. Mode Selector Bar */
        .mode-scroll-deck {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: rgba(0, 0, 0, 0.7);
            padding: 5px 12px;
            border-radius: 30px;
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.16);
            width: fit-content;
        }

        .mode-chip {
            font-size: 13px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            padding: 7px 16px;
            border-radius: 20px;
            transition: 0.2s;
            white-space: nowrap;
        }

        .mode-chip.active {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.28);
        }

        /* 6. Professional Community Post Screen */
        .post-fullscreen-modal {
            display: none;
            position: absolute;
            inset: 0;
            background: #000000;
            z-index: 100;
            flex-direction: column;
            justify-content: space-between;
        }

        .post-inner-content {
            padding: 16px;
        }

        .post-author-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .post-author-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #11998e, #38ef7d);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 17px;
            color: #ffffff;
            border: 1.5px solid rgba(255,255,255,0.2);
            flex-shrink: 0;
        }

        .post-author-name {
            font-size: 14px;
            font-weight: 600;
        }

        .post-visibility-pill {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid var(--yt-border);
            color: #ffffff;
            padding: 4px 12px;
            border-radius: 16px;
            font-size: 12px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            margin-top: 3px;
        }

        .post-visibility-pill svg {
            width: 14px;
            height: 14px;
            fill: #ffffff;
        }

        .post-textarea-main {
            width: 100%;
            min-height: 140px;
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 16px;
            font-family: inherit;
            outline: none;
            resize: none;
            line-height: 1.45;
        }

        .post-textarea-main::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        /* Post Poll / Quiz Display Block */
        .interactive-post-card {
            display: none;
            background: var(--yt-panel);
            border: 1px solid var(--yt-border);
            border-radius: 12px;
            padding: 12px 14px;
            margin: 12px 0;
        }

        .interactive-card-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--yt-blue);
            margin-bottom: 8px;
        }

        .interactive-opt {
            background: var(--yt-panel2);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .attached-post-img-box {
            position: relative;
            margin: 10px 0;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--yt-border);
            display: none;
            max-height: 200px;
        }

        .attached-post-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .remove-attach-cross {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0,0,0,0.7);
            border: none;
            color: white;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .post-bottom-suite {
            padding-bottom: max(16px, env(safe-area-inset-bottom, 16px));
        }

        .post-gallery-strip {
            display: flex;
            gap: 8px;
            padding: 0 16px 12px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .post-gallery-strip::-webkit-scrollbar {
            display: none;
        }

        .strip-card {
            width: 66px;
            height: 66px;
            border-radius: 8px;
            background: #1a1a1a;
            border: 1px solid var(--yt-border);
            flex-shrink: 0;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .strip-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .post-tools-tray {
            display: flex;
            align-items: center;
            gap: 26px;
            padding: 12px 18px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .tray-icon-btn {
            background: none;
            border: none;
            color: #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
        }

        .tray-icon-btn svg {
            width: 24px;
            height: 24px;
            fill: #ffffff;
        }

        /* 7. YouTube Native Modal Builders (Poll & Quiz) */
        .yt-native-modal-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            z-index: 200;
            align-items: flex-end;
            justify-content: center;
        }

        .yt-native-modal-sheet {
            width: 100%;
            max-width: 500px;
            background: #212121;
            border-top-left-radius: 18px;
            border-top-right-radius: 18px;
            padding: 20px 18px max(24px, env(safe-area-inset-bottom, 24px));
            border-top: 1px solid var(--yt-border);
        }

        .sheet-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .sheet-input {
            width: 100%;
            background: #121212;
            border: 1px solid var(--yt-border);
            border-radius: 10px;
            padding: 12px 14px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            margin-bottom: 10px;
        }

        .sheet-btn-row {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }

        .sheet-action-btn {
            flex: 1;
            background: var(--yt-blue);
            color: #000;
            border: none;
            border-radius: 20px;
            padding: 10px 0;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }

        .sheet-cancel-btn {
            flex: 1;
            background: #333333;
            color: #fff;
            border: none;
            border-radius: 20px;
            padding: 10px 0;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        /* 8. Add Details Sheet */
        .add-details-sheet {
            display: none;
            position: absolute;
            inset: 0;
            background: #000000;
            z-index: 150;
            flex-direction: column;
        }

        .details-header-row {
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            border-bottom: 1px solid var(--yt-border);
        }

        .details-body {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        .details-item-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
        }

        .item-left-block {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .item-left-block svg {
            width: 22px;
            height: 22px;
            fill: #ffffff;
        }

        .item-small-sub {
            font-size: 12px;
            color: var(--yt-muted);
        }

        .item-big-label {
            font-size: 15px;
            font-weight: 500;
            color: #ffffff;
            margin-top: 2px;
        }

        .yt-switch {
            position: relative;
            width: 44px;
            height: 24px;
            background: #333333;
            border-radius: 14px;
            transition: 0.2s;
            cursor: pointer;
        }

        .yt-switch::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 20px;
            height: 20px;
            background: #888888;
            border-radius: 50%;
            transition: 0.2s;
        }

        .yt-switch.checked {
            background: var(--yt-blue);
        }

        .yt-switch.checked::after {
            transform: translateX(20px);
            background: #ffffff;
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 84px;
            transform: translate(-50%, 20px);
            background: #ffffff;
            color: #000000;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            opacity: 0;
            pointer-events: none;
            transition: 0.25s ease;
            z-index: 30000;
            white-space: nowrap;
        }

        .toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }
    </style>
</head>
<body>

    <input type="file" id="videoPicker" accept="video/*" style="display:none;" onchange="loadChosenVideo(event)">
    <input type="file" id="postImagePicker" accept="image/*" style="display:none;" onchange="loadPostImage(event)">

    <div class="app-viewport">

        <!-- CAMERA LAYER -->
        <div class="camera-background" id="cameraBackground">
            <video id="liveCameraFeed" autoplay playsinline muted></video>
        </div>

        <!-- TOP BAR -->
        <header class="top-action-bar">
            <a href="../frontend/index.html" class="circle-icon-btn">✕</a>

            <div class="add-sound-pill" id="topSoundPill" onclick="selectMusicTrack()">
                <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
                <span id="soundLabel">Add sound</span>
            </div>

            <div class="circle-icon-btn" onclick="showToast('Effects & Filters ready ✨')">
                <svg viewBox="0 0 24 24"><path d="M19 9l1.25-2.75L23 5l-2.75-1.25L19 1l-1.25 2.75L15 5l2.75 1.25L19 9zm-7.5.5L9 4 6.5 9.5 1 12l5.5 2.5L9 20l2.5-5.5L17 12l-5.5-2.5zM19 15l-1.25 2.75L15 19l2.75 1.25L19 23l1.25-2.75L23 19l-2.75-1.25L19 15z"/></svg>
            </div>
        </header>

        <!-- RIGHT TOOLS -->
        <div class="side-tool-column" id="sideToolColumn"></div>

        <!-- BOTTOM DECK -->
        <div class="bottom-control-deck">

            <!-- Live Details Pill -->
            <div class="live-preview-info" id="livePreviewInfo">
                <div class="live-creator-badge">
                    <div class="live-creator-avatar">CB</div>
                    <span>Charandas Bhaskar • Public</span>
                </div>
            </div>

            <!-- Standard Video/Shorts Capture Row -->
            <div class="capture-row" id="captureRow">
                <div class="gallery-box" onclick="document.getElementById('videoPicker').click()">
                    <div class="gallery-preview-mini">
                        <img src="https://images.unsplash.com/photo-1524492412937-b28074a5d7da?w=100" alt="Gallery">
                    </div>
                    <span>Add</span>
                </div>

                <div class="shutter-outer-ring" id="shutterBtn" onclick="toggleRecording()">
                    <div class="shutter-inner-red"></div>
                </div>

                <div style="width: 54px;"></div>
            </div>

            <!-- Live Action Stack (Practice mode & Next) -->
            <div class="live-btn-stack" id="liveBtnStack">
                <button class="big-pill-btn" onclick="handleLiveNext()">Next</button>
                <button class="practice-mode-btn" onclick="showToast('Practice mode on (Only you can view)')">Practice mode</button>
            </div>

            <!-- 4-Mode Selector -->
            <nav class="mode-scroll-deck">
                <span class="mode-chip" id="modeVideo" onclick="switchMode('video')">Video</span>
                <span class="mode-chip active" id="modeShort" onclick="switchMode('short')">Short</span>
                <span class="mode-chip" id="modeLive" onclick="switchMode('live')">Live</span>
                <span class="mode-chip" id="modePost" onclick="switchMode('post')">Post</span>
            </nav>
        </div>

        <!-- COMMUNITY POST MODAL -->
        <div class="post-fullscreen-modal" id="postModal">
            <div>
                <header class="top-action-bar" style="position:relative; background:#000; border-bottom:1px solid var(--yt-border);">
                    <div style="display:flex; align-items:center; gap:16px;">
                        <button class="circle-icon-btn" onclick="closePostModal()">✕</button>
                        <span style="font-size:17px; font-weight:700;">Create post</span>
                    </div>
                    <button class="big-pill-btn" style="width:auto; padding:6px 20px; font-size:13px;" onclick="publishPostNow()">Post</button>
                </header>

                <div class="post-inner-content">
                    <div class="post-author-row">
                        <div class="post-author-avatar">CB</div>
                        <div>
                            <div class="post-author-name">Charandas Bhaskar</div>
                            <div class="post-visibility-pill" onclick="openDetailsSheet()">
                                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
                                <span id="postChipVisLabel">Public</span>
                            </div>
                        </div>
                    </div>

                    <textarea class="post-textarea-main" id="postText" placeholder="Share an image to start a caption contest"></textarea>

                    <!-- Interactive Attached Card (Poll / Quiz) -->
                    <div class="interactive-post-card" id="interactivePostCard">
                        <div class="interactive-card-title" id="cardHeading">📊 Poll</div>
                        <div id="cardQuestion" style="font-size:14px; font-weight:600; margin-bottom:8px;">Question</div>
                        <div class="interactive-opt" id="opt1">Option 1</div>
                        <div class="interactive-opt" id="opt2">Option 2</div>
                    </div>

                    <div class="attached-post-img-box" id="attachedImgBox">
                        <img id="attachedPostImg" alt="Attached">
                        <button class="remove-attach-cross" onclick="removePostAttachment()">✕</button>
                    </div>
                </div>
            </div>

            <div class="post-bottom-suite">
                <div class="post-gallery-strip">
                    <div class="strip-card" onclick="document.getElementById('postImagePicker').click()">
                        <span>📷</span>
                    </div>
                    <div class="strip-card" onclick="attachPresetImg('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=600')">
                        <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=200" alt="Nature">
                    </div>
                    <div class="strip-card" onclick="attachPresetImg('https://images.unsplash.com/photo-1518495973542-4542c06a5843?w=600')">
                        <img src="https://images.unsplash.com/photo-1518495973542-4542c06a5843?w=200" alt="Sunset">
                    </div>
                </div>

                <div class="post-tools-tray">
                    <button class="tray-icon-btn" onclick="openPollBuilder()" title="Poll">
                        <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/></svg>
                    </button>
                    <button class="tray-icon-btn" onclick="document.getElementById('postImagePicker').click()" title="Image">
                        <svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
                    </button>
                    <button class="tray-icon-btn" onclick="openQuizBuilder()" title="Quiz">
                        <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-9 14l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
                    </button>
                </div>

                <nav class="mode-scroll-deck" style="margin-top: 14px; margin-left: auto; margin-right: auto;">
                    <span class="mode-chip" onclick="switchMode('short'); closePostModal();">Short</span>
                    <span class="mode-chip" onclick="switchMode('live'); closePostModal();">Live</span>
                    <span class="mode-chip active">Post</span>
                </nav>
            </div>
        </div>

        <!-- 7. POLL & QUIZ NATIVE MODAL BUILDER (NO BROWSER POPUPS) -->
        <div class="yt-native-modal-backdrop" id="nativeBuilderModal">
            <div class="yt-native-modal-sheet">
                <div class="sheet-title">
                    <span id="builderModalTitle">Create a poll</span>
                    <span onclick="closeBuilderModal()" style="cursor:pointer; font-size:18px;">✕</span>
                </div>
                <input type="text" class="sheet-input" id="builderQuestion" placeholder="Ask your community...">
                <input type="text" class="sheet-input" id="builderOpt1" placeholder="Option 1">
                <input type="text" class="sheet-input" id="builderOpt2" placeholder="Option 2">
                <div class="sheet-btn-row">
                    <button class="sheet-cancel-btn" onclick="closeBuilderModal()">Cancel</button>
                    <button class="sheet-action-btn" onclick="applyBuilderData()">Add to Post</button>
                </div>
            </div>
        </div>

        <!-- 8. ADD DETAILS SHEET -->
        <div class="add-details-sheet" id="detailsSheet">
            <header class="details-header-row">
                <div style="display:flex; align-items:center; gap:16px;">
                    <button class="circle-icon-btn" onclick="closeDetailsSheet()">✕</button>
                    <span style="font-size:17px; font-weight:700;">Add details</span>
                </div>
                <button class="big-pill-btn" style="width:auto; padding:6px 18px; font-size:13px;" onclick="closeDetailsSheet()">Done</button>
            </header>

            <div class="details-body">
                <div class="details-item-row" onclick="cyclePostVis()">
                    <div class="item-left-block">
                        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
                        <div>
                            <div class="item-small-sub">Visibility</div>
                            <div class="item-big-label" id="sheetVisVal">Public</div>
                        </div>
                    </div>
                </div>

                <div class="details-item-row" onclick="toggleSwitch('schedSwitch')">
                    <div class="item-left-block">
                        <svg viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7z"/></svg>
                        <div>
                            <div class="item-big-label">Schedule</div>
                        </div>
                    </div>
                    <div class="yt-switch" id="schedSwitch"></div>
                </div>

                <div class="details-item-row" onclick="toggleExpirySwitch()">
                    <div class="item-left-block">
                        <svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
                        <div>
                            <div class="item-small-sub">Expiry</div>
                            <div class="item-big-label" id="sheetExpiryVal">None</div>
                        </div>
                    </div>
                    <div class="yt-switch" id="expirySwitch"></div>
                </div>
            </div>
        </div>

    </div>

    <div id="toast" class="toast"></div>

    <script>
        let currentMode = 'short';
        let isRecording = false;
        let activeBuilderType = 'poll';

        const toast = document.getElementById('toast');
        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        window.addEventListener('load', () => {
            initCamera();
            renderToolsForMode('short');
        });

        function initCamera() {
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: true })
                    .then(stream => {
                        document.getElementById('liveCameraFeed').srcObject = stream;
                    })
                    .catch(() => {});
            }
        }

        function switchMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-chip').forEach(c => c.classList.remove('active'));
            const activeChip = document.getElementById('mode' + mode.charAt(0).toUpperCase() + mode.slice(1));
            if (activeChip) activeChip.classList.add('active');

            const soundPill = document.getElementById('topSoundPill');
            const captureRow = document.getElementById('captureRow');
            const liveInfo = document.getElementById('livePreviewInfo');
            const liveStack = document.getElementById('liveBtnStack');

            if (mode === 'short') {
                soundPill.style.display = 'flex';
                captureRow.style.display = 'flex';
                liveInfo.style.display = 'none';
                liveStack.style.display = 'none';
                renderToolsForMode('short');
                showToast('Shorts Camera Mode ⚡');
            } else if (mode === 'video') {
                soundPill.style.display = 'none';
                captureRow.style.display = 'flex';
                liveInfo.style.display = 'none';
                liveStack.style.display = 'none';
                renderToolsForMode('video');
                showToast('Video Mode 📹');
            } else if (mode === 'live') {
                soundPill.style.display = 'none';
                captureRow.style.display = 'none';
                liveInfo.style.display = 'flex';
                liveStack.style.display = 'flex';
                renderToolsForMode('live');
                showToast('Live Mode 🔴');
            } else if (mode === 'post') {
                openPostModal();
            }
        }

        function renderToolsForMode(mode) {
            const col = document.getElementById('sideToolColumn');
            col.innerHTML = '';

            if (mode === 'short') {
                col.innerHTML = `
                    <div class="tool-action-item" onclick="showToast('Camera flipped')">
                        <div class="tool-round-btn"><svg viewBox="0 0 24 24"><path d="M9 12c0 1.66 1.34 3 3 3s3-1.34 3-3-1.34-3-3-3-3 1.34-3 3zm11-4h-3.17L15 6H9L7.17 8H4c-1.1 0-2 .9-2 2v9c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2z"/></svg></div>
                    </div>
                    <div class="tool-action-item" onclick="showToast('Timer: 3s')">
                        <div class="tool-round-btn"><svg viewBox="0 0 24 24"><path d="M15 1H9v2h6V1zm-4 13h2V8h-2v6zm8.03-6.61l1.42-1.42c-.43-.51-.9-.99-1.41-1.41l-1.42 1.42C16.07 4.74 14.12 4 12 4c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-2.12-.74-4.07-1.97-5.61zM12 20c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/></svg></div>
                    </div>
                    <div class="tool-action-item" onclick="showToast('Switched to 60s')">
                        <div class="tool-round-btn" style="font-size:12px;">15 s</div>
                    </div>
                    <div class="tool-action-item" onclick="showToast('Effects active ✨')">
                        <div class="tool-round-btn">✨</div>
                    </div>
                    <div class="tool-action-item" onclick="showToast('Speed: 1x')">
                        <div class="tool-round-btn" style="font-size:12px;">1x</div>
                    </div>
                `;
            } else if (mode === 'live') {
                col.innerHTML = `
                    <div class="tool-action-item" onclick="showToast('Flip camera')">
                        <span class="tool-title">Flip</span>
                        <div class="tool-round-btn">🔄</div>
                    </div>
                    <div class="tool-action-item" onclick="showToast('Mic Muted 🔇')">
                        <span class="tool-title">Mute</span>
                        <div class="tool-round-btn">🎙️</div>
                    </div>
                    <div class="tool-action-item" onclick="showToast('Video hidden')">
                        <span class="tool-title">Hide video</span>
                        <div class="tool-round-btn">📹</div>
                    </div>
                    <div class="tool-action-item" onclick="showToast('Orientation locked')">
                        <span class="tool-title">Orientation</span>
                        <div class="tool-round-btn">📱</div>
                    </div>
                    <div class="tool-action-item" onclick="showToast('Green screen on')">
                        <span class="tool-title">Green screen</span>
                        <div class="tool-round-btn">👤</div>
                    </div>
                `;
            } else {
                col.innerHTML = `
                    <div class="tool-action-item" onclick="showToast('Flip')">
                        <div class="tool-round-btn">🔄</div>
                    </div>
                    <div class="tool-action-item" onclick="showToast('Flash on ⚡')">
                        <div class="tool-round-btn">⚡</div>
                    </div>
                `;
            }
        }

        function toggleRecording() {
            isRecording = !isRecording;
            const ring = document.getElementById('shutterBtn');
            if (isRecording) {
                ring.classList.add('recording');
                showToast('Recording started... 🔴');
            } else {
                ring.classList.remove('recording');
                showToast('Recording saved!');
                setTimeout(() => {
                    window.location.href = currentMode === 'short' ? 'shorts.html' : 'watch.html';
                }, 800);
            }
        }

        function handleLiveNext() {
            showToast('🔴 Going Live...');
            setTimeout(() => {
                window.location.href = `watch.html?title=Charandas+Bhaskar+Live&channel=Charandas+Bhaskar&views=🔴+Live+Now`;
            }, 800);
        }

        function selectMusicTrack() {
            const track = prompt('Choose Audio Track:\n1. Chhattisgarhi Folk Beats\n2. Vande Mataram\n3. Trending Lofi', '1');
            if (track) {
                document.getElementById('soundLabel').textContent = 'Folk Beats 🎵';
                showToast('Sound applied! 🎵');
            }
        }

        function openPostModal() {
            document.getElementById('postModal').style.display = 'flex';
        }

        function closePostModal() {
            document.getElementById('postModal').style.display = 'none';
            switchMode('short');
        }

        function openDetailsSheet() {
            document.getElementById('detailsSheet').style.display = 'flex';
        }

        function closeDetailsSheet() {
            document.getElementById('detailsSheet').style.display = 'none';
        }

        function toggleSwitch(id) {
            const el = document.getElementById(id);
            el.classList.toggle('checked');
            showToast(el.classList.contains('checked') ? 'Schedule Active 📅' : 'Schedule Off');
        }

        function toggleExpirySwitch() {
            const el = document.getElementById('expirySwitch');
            el.classList.toggle('checked');
            const val = document.getElementById('sheetExpiryVal');
            val.textContent = el.classList.contains('checked') ? '24 hours' : 'None';
            showToast('Expiry: ' + val.textContent);
        }

        function cyclePostVis() {
            const val = document.getElementById('sheetVisVal');
            val.textContent = val.textContent === 'Public' ? 'Members Only' : 'Public';
            document.getElementById('postChipVisLabel').textContent = val.textContent;
            showToast('Visibility: ' + val.textContent);
        }

        function attachPresetImg(url) {
            document.getElementById('attachedPostImg').src = url;
            document.getElementById('attachedImgBox').style.display = 'block';
            showToast('Photo selected! 📷');
        }

        function removePostAttachment() {
            document.getElementById('attachedImgBox').style.display = 'none';
            document.getElementById('attachedPostImg').src = '';
            showToast('Photo removed');
        }

        function loadPostImage(e) {
            const file = e.target.files[0];
            if (!file) return;
            const r = new FileReader();
            r.onload = ev => {
                attachPresetImg(ev.target.result);
            };
            r.readAsDataURL(file);
        }

        /* NATIVE MODAL BUILDER (POLL & QUIZ) - NO DEFAULT BROWSER ALERTS */
        function openPollBuilder() {
            activeBuilderType = 'poll';
            document.getElementById('builderModalTitle').textContent = 'Create a poll';
            document.getElementById('builderQuestion').placeholder = 'Ask your community...';
            document.getElementById('builderOpt1').placeholder = 'Option 1';
            document.getElementById('builderOpt2').placeholder = 'Option 2';
            document.getElementById('nativeBuilderModal').style.display = 'flex';
            document.getElementById('builderQuestion').focus();
        }

        function openQuizBuilder() {
            activeBuilderType = 'quiz';
            document.getElementById('builderModalTitle').textContent = 'Create a quiz';
            document.getElementById('builderQuestion').placeholder = 'Enter quiz question...';
            document.getElementById('builderOpt1').placeholder = 'Option 1 (Correct answer)';
            document.getElementById('builderOpt2').placeholder = 'Option 2';
            document.getElementById('nativeBuilderModal').style.display = 'flex';
            document.getElementById('builderQuestion').focus();
        }

        function closeBuilderModal() {
            document.getElementById('nativeBuilderModal').style.display = 'none';
        }

        function applyBuilderData() {
            const q = document.getElementById('builderQuestion').value.trim();
            const o1 = document.getElementById('builderOpt1').value.trim() || 'Option 1';
            const o2 = document.getElementById('builderOpt2').value.trim() || 'Option 2';

            if (!q) {
                showToast('Please enter a question');
                return;
            }

            const card = document.getElementById('interactivePostCard');
            document.getElementById('cardHeading').textContent = activeBuilderType === 'poll' ? '📊 Poll' : '✅ Quiz';
            document.getElementById('cardQuestion').textContent = q;
            document.getElementById('opt1').textContent = o1;
            document.getElementById('opt2').textContent = o2;
            card.style.display = 'block';

            closeBuilderModal();
            showToast(`${activeBuilderType === 'poll' ? 'Poll' : 'Quiz'} added!`);
        }

        function publishPostNow() {
            showToast('🎉 Community Post Published!');
            setTimeout(() => {
                window.location.href = 'profile.html';
            }, 900);
        }

        function loadChosenVideo(e) {
            const file = e.target.files[0];
            if (!file) return;
            showToast('Video selected: ' + file.name);
            setTimeout(() => {
                window.location.href = currentMode === 'short' ? 'shorts.html' : 'watch.html';
            }, 800);
        }
    </script>
</body>
</html>
