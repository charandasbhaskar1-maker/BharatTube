<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#070b10">
    <title>BharatTube - Upload Video</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg: #070b10;
            --panel: #111821;
            --panel2: #171f29;
            --border: #27313d;
            --text: #f5f7fa;
            --muted: #9aa5b1;
            --red: #ff3040;
            --red-hover: #d91f2d;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding-bottom: 40px;
        }

        /* Header */
        .upload-header {
            height: 56px;
            background: rgba(7, 11, 16, 0.98);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .back-link {
            color: var(--muted);
            text-decoration: none;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .header-title {
            font-size: 16px;
            font-weight: 700;
        }

        .brand-badge {
            width: 28px;
            height: 28px;
            border-radius: 7px;
            background: var(--red);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 15px;
        }

        /* Container */
        .container {
            max-width: 600px;
            margin: 20px auto;
            padding: 0 16px;
        }

        .upload-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 22px 18px;
        }

        /* Drop Zone */
        .file-dropzone {
            border: 2px dashed var(--border);
            border-radius: 12px;
            background: var(--panel2);
            padding: 30px 16px;
            text-align: center;
            margin-bottom: 20px;
            cursor: pointer;
            transition: 0.2s;
        }

        .file-dropzone:hover {
            border-color: var(--red);
        }

        .drop-icon {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .dropzone-text {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .dropzone-sub {
            font-size: 11px;
            color: var(--muted);
        }

        input[type="file"] {
            display: none;
        }

        /* Inputs */
        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #c9d2dc;
            margin-bottom: 6px;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            background: var(--panel2);
            border: 1px solid var(--border);
            border-radius: 9px;
            padding: 10px 14px;
            color: #ffffff;
            font-size: 13px;
            outline: none;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            border-color: var(--red);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        /* Buttons */
        .submit-btn {
            width: 100%;
            height: 44px;
            background: var(--red);
            border: 0;
            border-radius: 10px;
            color: #ffffff;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.2s;
        }

        .submit-btn:hover {
            background: var(--red-hover);
        }

        /* Progress Placeholder */
        .upload-progress {
            display: none;
            margin-top: 15px;
            background: var(--panel2);
            border-radius: 8px;
            padding: 12px;
            border: 1px solid var(--border);
        }

        .progress-bar-bg {
            height: 6px;
            background: #2a3442;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 8px;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: var(--red);
            transition: width 0.3s;
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 30px;
            transform: translate(-50%, 20px);
            background: #ffffff;
            color: #0b0f14;
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            opacity: 0;
            pointer-events: none;
            transition: 0.25s ease;
            z-index: 3000;
            white-space: nowrap;
        }

        .toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }
    </style>
</head>
<body>

    <header class="upload-header">
        <a href="../frontend/index.html" class="back-link">← Home</a>
        <div class="header-title">Upload Video</div>
        <div class="brand-badge">B</div>
    </header>

    <main class="container">
        <div class="upload-card">
            <form id="uploadForm">

                <!-- File Chooser -->
                <div class="file-dropzone" id="dropZone">
                    <div class="drop-icon">📤</div>
                    <div class="dropzone-text" id="selectedFileName">वीडियो फ़ाइल चुनें</div>
                    <div class="dropzone-sub">MP4, WEBM या MOV (Max 500MB)</div>
                    <input type="file" id="videoFileInput" accept="video/*">
                </div>

                <div class="form-group">
                    <label>वीडियो का शीर्षक (Title)</label>
                    <input type="text" id="videoTitle" placeholder="उदा. My First Vlog in Chhattisgarh" required>
                </div>

                <div class="form-group">
                    <label>विवरण (Description)</label>
                    <textarea id="videoDesc" placeholder="वीडियो के बारे में लिखें..."></textarea>
                </div>

                <div class="form-group">
                    <label>कैटेगरी (Category)</label>
                    <select id="videoCategory">
                        <option value="music">Music</option>
                        <option value="shorts">Shorts</option>
                        <option value="news">News</option>
                        <option value="education">Education</option>
                        <option value="gaming">Gaming</option>
                        <option value="entertainment">Entertainment</option>
                        <option value="devotional">Devotional</option>
                        <option value="sports">Sports</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>थंबनेल फ़ोटो (Thumbnail Image)</label>
                    <input type="file" id="thumbFileInput" accept="image/*" style="display:block;">
                </div>

                <button type="submit" class="submit-btn" id="uploadSubmitBtn">Upload Video</button>

                <!-- Fake Progress for Demo -->
                <div class="upload-progress" id="uploadProgress">
                    <div style="font-size:12px; display:flex; justify-content:space-between;">
                        <span>Uploading...</span>
                        <span id="percentText">0%</span>
                    </div>
                    <div class="progress-bar-bg">
                        <div class="progress-bar-fill" id="progressBar"></div>
                    </div>
                </div>

            </form>
        </div>
    </main>

    <div id="toast" class="toast"></div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const videoFileInput = document.getElementById('videoFileInput');
        const selectedFileName = document.getElementById('selectedFileName');
        const uploadForm = document.getElementById('uploadForm');
        const uploadProgress = document.getElementById('uploadProgress');
        const progressBar = document.getElementById('progressBar');
        const percentText = document.getElementById('percentText');
        const toast = document.getElementById('toast');

        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        dropZone.addEventListener('click', () => {
            videoFileInput.click();
        });

        videoFileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                selectedFileName.textContent = 'चयनित: ' + e.target.files[0].name;
            }
        });

        uploadForm.addEventListener('submit', (e) => {
            e.preventDefault();

            if (!videoFileInput.files.length) {
                showToast('कृपया पहले कोई वीडियो फ़ाइल चुनें!');
                return;
            }

            uploadProgress.style.display = 'block';
            let percent = 0;

            const interval = setInterval(() => {
                percent += 20;
                progressBar.style.width = percent + '%';
                percentText.textContent = percent + '%';

                if (percent >= 100) {
                    clearInterval(interval);
                    showToast('वीडियो सफलतापूर्वक अपलोड हो गया! (MVP)');
                    setTimeout(() => {
                        window.location.href = '../frontend/index.html';
                    }, 1500);
                }
            }, 300);
        });
    </script>
</body>
</html>
