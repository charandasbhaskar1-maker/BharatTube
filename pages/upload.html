<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0f0f0f">
    <title>Add details - BharatTube</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0f0f0f;
            color: #ffffff;
            padding-bottom: 75px;
        }

        /* Top YouTube Header */
        .yt-upload-header {
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            position: sticky;
            top: 0;
            background: #0f0f0f;
            z-index: 100;
            border-bottom: 1px solid #272727;
        }

        .header-left-box {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .btn-back-arrow {
            background: none;
            border: none;
            color: #ffffff;
            display: flex;
            align-items: center;
            cursor: pointer;
            text-decoration: none;
        }

        .btn-back-arrow svg {
            width: 22px;
            height: 22px;
            fill: #ffffff;
        }

        .page-title-text {
            font-size: 18px;
            font-weight: 700;
        }

        .btn-next-upload {
            background: #272727;
            color: #717171;
            border: none;
            padding: 6px 18px;
            border-radius: 18px;
            font-size: 13px;
            font-weight: 700;
            cursor: not-allowed;
            transition: all 0.2s ease;
        }

        .btn-next-upload.ready {
            background: #3ea6ff;
            color: #0f0f0f;
            cursor: pointer;
        }

        /* Top Hero: Video & Creator Info */
        .yt-hero-section {
            padding: 16px;
            display: flex;
            gap: 14px;
            border-bottom: 1px solid #212121;
        }

        .media-preview-box {
            width: 110px;
            height: 140px;
            border-radius: 10px;
            background: #212121;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            border: 1px solid #333333;
            cursor: pointer;
        }

        .media-preview-box video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .thumb-overlay-btn {
            position: absolute;
            top: 6px;
            left: 6px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.65);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .thumb-overlay-btn svg {
            width: 16px;
            height: 16px;
            fill: #ffffff;
        }

        .upload-icon-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            color: #888;
            font-size: 11px;
            text-align: center;
            padding: 6px;
        }

        .upload-icon-placeholder svg {
            width: 28px;
            height: 28px;
            fill: #3ea6ff;
        }

        .hero-title-side {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .channel-chip-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .channel-avatar-sm {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #e50914;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 800;
            color: #fff;
        }

        .channel-name-sm {
            font-size: 13px;
            color: #aaaaaa;
            font-weight: 500;
        }

        .input-title-area {
            width: 100%;
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 15px;
            font-weight: 500;
            outline: none;
            resize: none;
            height: 75px;
            line-height: 1.4;
        }

        .input-title-area::placeholder {
            color: #717171;
        }

        /* YouTube Settings List (Row Items) */
        .yt-options-list {
            display: flex;
            flex-direction: column;
        }

        .yt-list-item {
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #1f1f1f;
            cursor: pointer;
            text-decoration: none;
            color: #ffffff;
        }

        .item-left-block {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .item-icon-box {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .item-icon-box svg {
            width: 22px;
            height: 22px;
            fill: #ffffff;
        }

        .item-text-wrap {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .item-primary-text {
            font-size: 14px;
            font-weight: 500;
        }

        .item-secondary-text {
            font-size: 12px;
            color: #aaaaaa;
        }

        .item-arrow-right svg {
            width: 18px;
            height: 18px;
            fill: #717171;
        }

        /* Inline Description Box */
        .desc-box-wrapper {
            padding: 14px 16px;
            border-bottom: 1px solid #1f1f1f;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .desc-textarea {
            width: 100%;
            background: #181818;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            color: #ffffff;
            font-size: 13px;
            padding: 10px;
            outline: none;
            resize: none;
            height: 60px;
        }

        .desc-textarea:focus {
            border-color: #3ea6ff;
        }

        /* YouTube Blue Uploading Sheet */
        .upload-progress-drawer {
            position: fixed;
            bottom: 56px;
            left: 0;
            right: 0;
            background: #212121;
            padding: 12px 16px;
            display: none;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid #333333;
            z-index: 999;
        }

        .upload-progress-drawer.show {
            display: flex;
        }

        .progress-indicator-track {
            position: absolute;
            top: 0;
            left: 0;
            height: 2px;
            background: #3ea6ff;
            width: 0%;
            transition: width 0.2s linear;
        }

        /* Bottom Nav */
        .bottom-nav-fixed {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 56px;
            background: #0f0f0f;
            display: flex;
            align-items: center;
            justify-content: space-around;
            border-top: 1px solid #272727;
            z-index: 1000;
        }

        .nav-link-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 10px;
            color: #aaaaaa;
            text-decoration: none;
            gap: 3px;
        }

        .nav-link-btn svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        .nav-btn-plus {
            background: #ffffff;
            border-radius: 50%;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #0f0f0f;
            text-decoration: none;
        }

        .nav-btn-plus svg {
            width: 22px;
            height: 22px;
            fill: #0f0f0f;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="yt-upload-header">
        <div class="header-left-box">
            <a href="../index.html" class="btn-back-arrow">
                <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            </a>
            <span class="page-title-text">Add details</span>
        </div>
        <button class="btn-next-upload" id="nextUploadBtn" onclick="startAppUpload()">Next</button>
    </header>

    <!-- Native File Picker (Hidden) -->
    <input type="file" id="videoNativeInput" accept="video/*" style="display:none;" onchange="handlePickedVideo(event)">

    <!-- Split Hero: Preview + Title + Channel -->
    <section class="yt-hero-section">
        <div class="media-preview-box" onclick="document.getElementById('videoNativeInput').click()">
            <div class="upload-icon-placeholder" id="placeholderView">
                <svg viewBox="0 0 24 24"><path d="M9 16h6v-6h4l-7-7-7 7h4v6zm-4 2h14v2H5v-2z"/></svg>
                <span>Select file</span>
            </div>
            <video id="pickedVideoPlayer" playsinline loop muted autoplay></video>
            <div class="thumb-overlay-btn">
                <svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
            </div>
        </div>

        <div class="hero-title-side">
            <div class="channel-chip-row">
                <div class="channel-avatar-sm">CB</div>
                <span class="channel-name-sm">Charandas Bhaskar</span>
            </div>
            <textarea class="input-title-area" id="ytVideoTitle" placeholder="Create a title (type '@' to mention a channel)" oninput="checkInputValidity()"></textarea>
        </div>
    </section>

    <!-- Add Description Input -->
    <div class="desc-box-wrapper">
        <textarea class="desc-textarea" id="ytVideoDesc" placeholder="Add description (#tags, credits)"></textarea>
    </div>

    <!-- YouTube Studio Row Items -->
    <main class="yt-options-list">

        <!-- Visibility Row -->
        <div class="yt-list-item" onclick="toggleVisibilityCycle()">
            <div class="item-left-block">
                <div class="item-icon-box">
                    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
                </div>
                <div class="item-text-wrap">
                    <span class="item-primary-text">Visibility</span>
                    <span class="item-secondary-text" id="visibilityLabel">Public</span>
                </div>
            </div>
            <div class="item-arrow-right">
                <svg viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg>
            </div>
        </div>

        <!-- Audience Row -->
        <div class="yt-list-item" onclick="alert('Audience: Not made for kids')">
            <div class="item-left-block">
                <div class="item-icon-box">
                    <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                </div>
                <div class="item-text-wrap">
                    <span class="item-primary-text">Audience</span>
                    <span class="item-secondary-text">No, it\'s not made for kids</span>
                </div>
            </div>
            <div class="item-arrow-right">
                <svg viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg>
            </div>
        </div>

        <!-- Shorts Remixing Row -->
        <div class="yt-list-item" onclick="alert('Shorts Remixing: Allow video and audio remixing')">
            <div class="item-left-block">
                <div class="item-icon-box">
                    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14.5v-9l6 4.5-6 4.5z"/></svg>
                </div>
                <div class="item-text-wrap">
                    <span class="item-primary-text">Shorts remixing</span>
                    <span class="item-secondary-text">Allow video and audio remixing</span>
                </div>
            </div>
            <div class="item-arrow-right">
                <svg viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg>
            </div>
        </div>

        <!-- Location Row -->
        <div class="yt-list-item" onclick="promptLocation()">
            <div class="item-left-block">
                <div class="item-icon-box">
                    <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
                </div>
                <div class="item-text-wrap">
                    <span class="item-primary-text">Location</span>
                    <span class="item-secondary-text" id="locationLabel">None</span>
                </div>
            </div>
            <div class="item-arrow-right">
                <svg viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg>
            </div>
        </div>

    </main>

    <!-- Mini Uploading Drawer (YouTube style bottom progress) -->
    <div class="upload-progress-drawer" id="ytProgressDrawer">
        <div class="progress-indicator-track" id="lineProgress"></div>
        <div style="font-size:13px; font-weight:600;" id="drawerLabel">Uploading to your videos... 0%</div>
        <div style="font-size:12px; color:#3ea6ff; font-weight:700;">SEE VIDEO</div>
    </div>

    <!-- Bottom Nav -->
    <nav class="bottom-nav-fixed">
        <a href="../index.html" class="nav-link-btn">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span>Home</span>
        </a>
        <a href="shorts.html" class="nav-link-btn">
            <svg viewBox="0 0 24 24"><path d="M17.77 10.32l-1.2-.5-1.1-.46 1.05-.53c1.78-.9 2.5-3.08 1.6-4.86-.9-1.78-3.08-2.5-4.86-1.6L6.5 5.67c-1.78.9-2.5 3.08-1.6 4.86.32.64.83 1.13 1.44 1.43l1.2.5 1.1.46-1.05.53c-1.78.9-2.5 3.08-1.6 4.86.63 1.25 1.88 1.99 3.23 1.99.55 0 1.11-.13 1.63-.39l6.76-3.3c1.78-.9 2.5-3.08 1.6-4.86-.32-.64-.83-1.13-1.44-1.43zM10 14.5v-5l4.5 2.5-4.5 2.5z"/></svg>
            <span>Shorts</span>
        </a>
        <a href="upload.html" class="nav-btn-plus">
            <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        </a>
        <a href="channel.html" class="nav-link-btn">
            <svg viewBox="0 0 24 24"><path d="M20 8H4V6h16v2zm-2-6H6v2h12V2zm4 10v8c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2v-8c0-1.1.9-2 2-2h16c1.1 0 2 .9 2 2zm-6 4l-6-3.27v6.53L16 16z"/></svg>
            <span>Subscriptions</span>
        </a>
        <a href="profile.html" class="nav-link-btn">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>
            <span>You</span>
        </a>
    </nav>

    <script>
        function handlePickedVideo(e) {
            const file = e.target.files[0];
            if (!file) return;

            const video = document.getElementById('pickedVideoPlayer');
            const placeholder = document.getElementById('placeholderView');
            const titleInput = document.getElementById('ytVideoTitle');

            video.src = URL.createObjectURL(file);
            video.style.display = 'block';
            placeholder.style.display = 'none';

            if (!titleInput.value) {
                titleInput.value = file.name.replace(/\.[^/.]+$/, "");
                checkInputValidity();
            }
        }

        function checkInputValidity() {
            const val = document.getElementById('ytVideoTitle').value.trim();
            const btn = document.getElementById('nextUploadBtn');
            if (val.length > 0) {
                btn.classList.add('ready');
            } else {
                btn.classList.remove('ready');
            }
        }

        const visibilities = ['Public', 'Unlisted', 'Private'];
        let visIndex = 0;
        function toggleVisibilityCycle() {
            visIndex = (visIndex + 1) % visibilities.length;
            document.getElementById('visibilityLabel').innerText = visibilities[visIndex];
        }

        function promptLocation() {
            const loc = prompt('Enter Location (e.g. Chhattisgarh, India):', 'Chhattisgarh, India');
            if (loc) document.getElementById('locationLabel').innerText = loc;
        }

        function startAppUpload() {
            const btn = document.getElementById('nextUploadBtn');
            if (!btn.classList.contains('ready')) return;

            const drawer = document.getElementById('ytProgressDrawer');
            const line = document.getElementById('lineProgress');
            const label = document.getElementById('drawerLabel');

            drawer.classList.add('show');
            btn.classList.remove('ready');

            let pct = 0;
            const timer = setInterval(() => {
                pct += 12;
                line.style.width = pct + '%';
                label.innerText = `Uploading to your videos... ${pct}%`;

                if (pct >= 100) {
                    clearInterval(timer);
                    label.innerText = 'Upload complete • Processing...';
                    setTimeout(() => {
                        window.location.href = '../index.html';
                    }, 1000);
                }
            }, 150);
        }
    </script>
</body>
</html>
